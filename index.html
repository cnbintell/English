han State, is very famous among tourists."}, {"n": 9, "q": "The suit was so expensive that I could not afford it. (Rewrite the sentence using 'such...that'.)", "a": "It was such an expensive suit that I could not afford it."}, {"n": 10, "q": "She may have gone to the pagoda. She may have gone to the monastery. (Join, using 'either...or'.)", "a": "She may have gone either to the pagoda or to the monastery."}]}, {"id": 38, "questions": [{"n": 1, "q": "The teacher said to the class, \"Stand up.\" (Change the sentence into the reported speech.)", "a": "The teacher told the class to stand up."}, {"n": 2, "q": "I may be tired very much. I always enjoy reading before going to bed. (Use 'no matter...'.)", "a": "No matter how much tired I am, I always enjoy reading before going to bed."}, {"n": 3, "q": "The woman is not strong enough to stand up. (Combine the sentences using 'too...to'.)", "a": "The woman is too weak to stand up."}, {"n": 4, "q": "If I knew her address, I (send) her an invitation. (Use the correct tense of the verb given in brackets.)", "a": "If I knew her address, I would send her an invitation."}, {"n": 5, "q": "If you work harder, you will succeed more. (Rewrite, using 'the more/less/ -er, the more/less/-er')", "a": "The harder you work, the more you will succeed."}, {"n": 6, "q": "I cleaned the house and so did May May. (Rewrite the sentences using 'both...and'.)", "a": "Both I and May May cleaned the house."}, {"n": 7, "q": "My friend speaks English much better than I do. (Rewrite, using 'not as...as'.)", "a": "I do not speak English as well as my friend."}, {"n": 8, "q": "Bagan is an ancient city. We will visit Bagan this summer. (Combine, using 'Nouns in Apposition'.)", "a": "We will visit Bagan, an ancient city, this summer."}, {"n": 9, "q": "The receptionist is ill. She works at the lawyer's office. (Use the appropriate relative pronoun.)", "a": "The receptionist who works at the lawyer's office is ill."}, {"n": 10, "q": "The weather was hot. The students continued playing football. (Use appropriate subordinating conjunction.)", "a": "Although the weather was hot, the students continued playing football."}]}, {"id": 39, "questions": [{"n": 1, "q": "My grandmother taught me how to cook curries. (Change the sentence into the passive voice.)", "a": "I was taught how to cook curries by my grandfather."}, {"n": 2, "q": "You are too young to understand what I mean. (Rewrite the sentence using 'enough to'.)", "a": "You are not old enough to understand what I mean."}, {"n": 3, "q": "If we travel more quickly, we will reach our destination faster. (Rewrite, using 'the more/less/ -er...,')", "a": "The more quickly we travel, the faster we will reach our destination."}, {"n": 4, "q": "He ate a lot of rice for dinner. He felt sleepy early. (Use 'the third conditional'.)", "a": "If he had not eaten a lot of rice for dinner, he would not felt sleepy early."}, {"n": 5, "q": "She took regular exercise. She did not lose weight. (Use the appropriate subordinating conjunction.)", "a": "Even though she took regular exercise, she did not lose weight."}, {"n": 6, "q": "Ma Ma speaks English more fluently than her friends. (Rewrite, using 'not as...as'.)", "a": "Her friends do not speak English as fluently as Ma Ma."}, {"n": 7, "q": "The Myanmar Traditional Chinlone Team won many gold medals in the $27^{th}$ SEA Games. (Rewrite the sentence using 'It is' / 'It was' emphasizing the underlined words.)", "a": "It is the Myanmar Traditional Chinlone Teams that won many gold medals in the $27^{th}$ Games."}, {"n": 8, "q": "Inlay Lake is visited by most tourists. It is one of the tourist attractions in Myanmar. (Combine the sentences using 'Nouns in Apposition'.)", "a": "Inlay Lake, one of the tourist attractions in Myanmar, is visited by most tourists."}, {"n": 9, "q": "The journey was so exciting that I could not forget it. (Rewrite the sentence using 'such...that'.)", "a": "It was such an exciting journey that I could not forget it."}, {"n": 10, "q": "We will go to Ngapali in summer. If not, we will go to Chaugtha in summer. (Join, using 'either...or'.)", "a": "We will go either to Ngapali or to Chaungtha in summer."}]}, {"id": 40, "questions": [{"n": 1, "q": "He worked the whole night. He couldn't finish the task. (Use the appropriate subordinating conjunction.)", "a": "In spite of working the whole night, he couldn't finish the task."}, {"n": 2, "q": "I was taught by experience that life is meaningful. (Change the sentence into the active voice.)", "a": "Experience taught us that life is meaningful."}, {"n": 3, "q": "As soon as Mya Mya realized that the house was on fire, she rang the fire station. (Rewrite the sentences by using 'No sooner......than'.)", "a": "No sooner did Mya Mya realize that the house was on fire than she rang the fire station."}, {"n": 4, "q": "Life may take us everywhere. Our friendship will endure. (Use 'no matter...'.)", "a": "No matter where life takes us, our friendship will endure."}, {"n": 5, "q": "U Hla Maung is a very strict person. He is the managing director of our company. (Combine the sentences using 'Nouns in Apposition'.)", "a": "U Hla Maung, a very strict person, is the managing director of our company."}, {"n": 6, "q": "Robots can work more precisely than human workers. (Rewrite, using 'not as...as'.)", "a": "Human workers cannot work as precisely as robots."}, {"n": 7, "q": "Mother said to Ko Ko, \"Did you go to the cinema with your friends yesterday?\" (Change the sentence into the reported speech.)", "a": "Mother told Ko Ko if he had gone to the cinema with his friends the previous day."}, {"n": 8, "q": "The students left the classroom. They did not shut all the windows. (Use 'without + V-ing'.)", "a": "Without shutting all the windows, the students left the classroom."}, {"n": 9, "q": "The day was so wet and cold that we stayed indoor. (Rewrite the sentence using 'such...that'.)", "a": "It was such a wet and cold day that we stayed indoor."}, {"n": 10, "q": "My sister and I cannot answer this question. (Join, using 'neither...nor'.)", "a": "Neither my sister nor I can answer this question."}]}, {"id": 41, "questions": [{"n": 1, "q": "You can find lots of good restaurants around here. (Change the sentence into the passive voice.)", "a": "Lots of good restaurants can be found around here."}, {"n": 2, "q": "Nyi Nyi's mother said to him, \"What did you do at school today?\" (Change into the reported speech.)", "a": "Nyi Nyi's mother asked him what he had not done at school that day."}, {"n": 3, "q": "I told my mother about my problem. Then I felt as if a weight had been lifted from my shoulders. (Combine the sentences using 'after + Ving'.)", "a": "After telling my mother about my problem, I feel as if a weight had been lifted from my shoulders."}, {"n": 4, "q": "Crowds line the road. They cheered the victorious footballers. (Rewrite, using the participle phrase.)", "a": "Lining the road, crowds cheered the victorious footballers."}, {"n": 5, "q": "I had had a big lunch. I was very hungry. (Join, using the appropriate subordinating conjunction.)", "a": "Although I had had a big lunch, I was very hungry."}, {"n": 6, "q": "If the football team does not train hard, it will not qualify for the World Cup. (Rewrite, using 'Unless'.)", "a": "Unless the football team trains hard, it will not qualify for the World Cup."}, {"n": 7, "q": "I had become very bored with running on my own. I decided to join a running club. (Combine the sentence using 'so...that'.)", "a": "I had become so bored with running on my won that I decided to join a running club."}, {"n": 8, "q": "Walking cuts out pollution. It also has the advantage of slowing down your lifestyle. (Combine, using 'not only...but also'.)", "a": "Walking not only cuts out pollution but also has the advantage of slowing down your lifestyle."}, {"n": 9, "q": "A number of important vitamins are naturally found in dark green vegetables like spinach. (Rewrite the sentence using 'It is' / 'It was' emphasizing the underlined words.)", "a": "It is in dark green vegetables like spinach that a number of important vitamins are found naturally."}, {"n": 10, "q": "My headache was so bad that I could not think straight. (Rewrite the sentence using 'such...that'.)", "a": "I had such a bad headache that I could not think straight."}]}, {"id": 42, "questions": [{"n": 1, "q": "The police have issued a description of the wanted man. (Change the sentence into the passive voice.)", "a": "A description of the wanted man has been issued by the police."}, {"n": 2, "q": "Capillaries carry pure blood from the arteries to all the tissues and organs of the body. (Rewrite the sentence using 'It is' / 'It was' emphasizing the underlined words.)", "a": "It is capillaries that carry pure blood from the arteries to all the tissues and organs of the body."}, {"n": 3, "q": "If the hotel does not have an internet connection, I will not send you an e-mail. (Rewrite, using 'Unless'.)", "a": "Unless the hotel has an internet connection, I will not send you an e-mail."}, {"n": 4, "q": "As soon as the ship left port, a violent storm developed. (Rewrite, using 'No sooner......than'.)", "a": "No sooner did the ship leave port than a violent storm developed."}, {"n": 5, "q": "\"Don't forget to give me a ring tomorrow, Peter,\" said Michael. (Change into the reported speech.)", "a": "Michael told Peter not to forget to give him a ring the next day."}, {"n": 6, "q": "Manila is the capital of Philippines. Manila comes alive with discos and the rhythms of Filipino bands and pop groups at night. (Combine the sentences using 'Nouns in Apposition'.)", "a": "Manila, the capital of Philippines, comes alive with discos and the rhythms of Filipino bands and pop groups at night."}, {"n": 7, "q": "She speaks Chinese fluently. She is not born in China. (Rewrite, using 'as if/ as though'.)", "a": "She speaks Chinese fluently as if she were born in China."}, {"n": 8, "q": "Mg Mg's motor cycle was stolen last night. Nobody saw it. (Join, using 'without + V-ing'.)", "a": "Without being seen, Mg Mg's motor cycle was stolen."}, {"n": 9, "q": "When people become wealthy, they will be proud. (Rewrite, using 'the more/less/-er...'.)", "a": "The wealthier people become, the prouder they will be."}, {"n": 10, "q": "People agree that computer is one of the greatest inventions. (Change the sentence into the passive voice beginning with 'it'.)", "a": "It is agreed that computer is one of the greatest inventons."}]}, {"id": 43, "questions": [{"n": 1, "q": "A crowded bus hit the lamp post near our house. (Change the sentence into the passive voice.)", "a": "The lamp post near our house was hit by a crowded bus."}, {"n": 2, "q": "If she does not take exercise, she will gain weight. (Rewrite the sentences by using 'Unless'.)", "a": "Unless she takes exercise, she will gain weight."}, {"n": 3, "q": "My sister is thin. She is healthy. (Join the sentences using the appropriate subordinating conjunction.)", "a": "Although my sister is thin, she is healthy."}, {"n": 4, "q": "He is not healthy. He does not give up smoking. (Use 'the second conditional'.)", "a": "He would be healthy if he gave up smoking."}, {"n": 5, "q": "Nilar said, \"Did you go to Ngapali with your friends last year, Tun Tun?\" (Change the sentence into the reported speech.)", "a": "Nilar asked Tun Tun if he had gone to Ngapali with his friends the previous year."}, {"n": 6, "q": "The maid sang a song. She washed the clothes under the tree. (Rewrite, using the participle phrase.)", "a": "Singing a song, the maid washed the clothes under the tree."}, {"n": 7, "q": "The main aim to use a certain language is to commuicate with each other. (Rewrite the sentence using 'It is' / 'It was' emphasizing the underlined words.)", "a": "It is to communicate with each other that is the main aim to use a certain language."}, {"n": 8, "q": "A wise man controls his anger. He knows that it causes mistakes. (Combine, using 'not only...but also'.)", "a": "A wise man not only controls his anger but also knows that it causes mistakes."}, {"n": 9, "q": "Sittway is a coastal town in Rakhine State. Sittway is clean and beautiful. (Use 'Nouns in Apposition'.)", "a": "Sittway, a coastal town in Rakhine State, is clean and beautiful."}, {"n": 10, "q": "Daw Nu was very satisfied with her son's marks in the test. She gave him a new watch. (Combine the sentence using 'so...that'.)", "a": "Daw Nu was so satisfied with her son's marks in the test that she gave him a new watch."}]}, {"id": 44, "questions": [{"n": 1, "q": "After Ma Ma had tidied her room, she took a rest. (Rewrite, using the participle phrase.)", "a": "Having tidied the room, Ma Ma took a rest."}, {"n": 2, "q": "\"Can't you draw in your room?\" Ko Ko said to Mi Mi. (Change the sentence into the reported speech.)", "a": "Ko Ko asked Mi Mi if she could not draw in her room."}, {"n": 3, "q": "I had just sat at the table when the light went out. (Rewrite the sentences by using 'No sooner...than'.)", "a": "No sooner had I sat at the table that the light went out."}, {"n": 4, "q": "The fishermen threw out their nets and waited patiently. (Combine the sentences using 'before + Ving'.)", "a": "After throwing out their nets, the fishermen waited patiently."}, {"n": 5, "q": "He had good qualities. He was quite stubborn. (Join, using the appropriate subordinating conjunction.)", "a": "Although he had good qualities, he was quite stubborn."}, {"n": 6, "q": "The organizers must display a great number of goods in a minimum space. (Change the sentence into the passive voice.)", "a": "A great number of goods must be displayed in a minimum space by the organizers."}, {"n": 7, "q": "He was so rich that he did not care about the high cost of living. (Combine, using 'such...that'.)", "a": "He was too rich to care about the high cost of living."}, {"n": 8, "q": "Neither Ko Ko nor Nyi Nyi eats pork. (Combine, using 'not only...but also'.)", "a": "Not only Ko Ko but also Nyi Nyi eats pork."}, {"n": 9, "q": "You can save your money in the bank. If not, you can buy gold bars with it. (Join, using 'either...or'.)", "a": "You can either save your money in the bank or buy gold bars with it."}, {"n": 10, "q": "The weather in Shan State is colder than that of Magwe. (Rewrite, using 'not as...as'.)", "a": "The weather in Magwe is not as cold as that of Shan State."}]}, {"id": 45, "questions": [{"n": 1, "q": "The teacher said to the students, \"Why weren't you listening to me?\" (Change into the reported speech.)", "a": "The teacher asked the students why they had not been listening to her/ him."}, {"n": 2, "q": "Kate showed me all the things she bought. (Change the sentence into the passive voice.)", "a": "I was shown by Kate all the things she bought. / I was shown all the things Kate bought. / I was shown all the things she bought by Kate."}, {"n": 3, "q": "Bill Gate is so rich that he is rated as one of the richest men in the world. (Rewrite, using 'such...that'.)", "a": "Bill Gate is such a rich man that he is rated as one of the richest men in the world."}, {"n": 4, "q": "As soon as Kyi Kyi saw the fire, she telephoned the fire department. (Use 'No sooner......than'.)", "a": "No sooner did Kyi Kyi see the fire than she telephoned the fire department."}, {"n": 5, "q": "He is said (be) the best teacher in our school. (Rewrite, using the infinitive or gerund form of the verb given in bracket.)", "a": "He is said to be the best teacher in our school."}, {"n": 6, "q": "Helen was a difficult child. Her parents loved her. (Join, using the appropriate subordinating conjunction.)", "a": "Although Helen was a difficult child, her parents loved her."}, {"n": 7, "q": "I had a cup of tea, and I left for work this morning. (Combine the sentences using 'before + Ving'.)", "a": "I had a cup of tea before leaving for work this morning."}, {"n": 8, "q": "Football is the most popular game in the world. We all like to play football. (Combine the sentences using 'Nouns in Apposition'.)", "a": "We all like to play football, the most popular game in the world."}, {"n": 9, "q": "Both of the restaurants we went to were not expensive. (Join, using 'neither of'.)", "a": "Neither of the restaurants we went to was expensive."}, {"n": 10, "q": "Jurong Bird Park is not as large as Bird Paradise. (Rewrite using the comparative degree.)", "a": "Bird Paradise is larger than Jurong Bird Park."}]}, {"id": 46, "questions": [{"n": 1, "q": "The novel was very interesting and I read it twice. (Combine the sentences using 'such...that'.)", "a": "It was such an interesting novel that I read it twice."}, {"n": 2, "q": "I didn't know her phone number, so I was not able to ring her. (Rewrite, using the participle phrase.)", "a": "Not knowing her phone number, I was not able to ring her."}, {"n": 3, "q": "This computer holds more information than yours. (Rewrite, using 'not as...as'.)", "a": "This computer does not hold as much information as that one."}, {"n": 4, "q": "My father didn't earn much money, so life wasn't easy for me. (Rewrite, using 'third conditional'.)", "a": "If my father had earned much money, life would have been easy for me."}, {"n": 5, "q": "It's difficult to find work these days. Joe has just given up his job. (Join the sentences using the appropriate subordinating conjunction.)", "a": "Even though it is difficult to find work these days, Joe has just given up his job."}, {"n": 6, "q": "I arrived at the cinema early. I did not want to miss the beginning of the film. (Join the sentences using 'not to'.)", "a": "I arrived at the cinema early not to miss the beginning of the film."}, {"n": 7, "q": "I said to my mother, \"Did you book a room with a balcony?\" (Change into the reported speech.)", "a": "I asked my mother if he had booked a room with a balcony."}, {"n": 8, "q": "Archaeologists have discovered a new tomb in Egypt. (Change the sentence into the passive voice.)", "a": "A new tomb has been discovered in Egypt by archaeologists."}, {"n": 9, "q": "Ngapali is an attractive beach. Most people like to visit there. (Combine, using 'Nouns in Apposition'.)", "a": "Most people like to visit Ngapali, an attractive beach."}, {"n": 10, "q": "I bought a watch from Cherry Oo. It is a birthday present for my sister. (Combine, using the appropriate relative pronoun.)", "a": "The watch which I bought from Cherry Oo is a birthday present for my sister."}]}, {"id": 47, "questions": [{"n": 1, "q": "Nowadays, respect for money has replaced respect for wisdom and knowledge. (Change the sentence into the passive voice.)", "a": "Nowadays, respect for wisdom and knowledge has been replaced with/by respect for money."}, {"n": 2, "q": "The climb was so difficult that we stopped to rest several times. (Combine, using 'such...that'.)", "a": "It was such a difficult climb that we stopped to rest several times."}, {"n": 3, "q": "She said, \"I'd love to help you, but I'm going on holiday with my friends tomorrow.\" (Change the sentence into the reported speech.)", "a": "She said that she would love to help me, but she was going on holiday with her friends the next day."}, {"n": 4, "q": "Computers were developed at the same time as TV and radio. Computers were put into public service in 1944. (Combine, using the appropriate relative pronoun.)", "a": "Computers, which were developed at the same time as TV and radio, were put into public service in 1944."}, {"n": 5, "q": "There were warnings about the approaching storm. The fishermen went ahead as planned. (Join the sentences using the appropriate subordinating conjunction.)", "a": "Although there were warnings about the approaching storm, the fishermen went ahead as planned."}, {"n": 6, "q": "Don't forget (lock) the door before (go) to school. (Complete the sentence with the 'gerund' or 'to + infinitive' form of the verb in bracket.)", "a": "Don't forget to lock the door before going to school."}, {"n": 7, "q": "University students in many countries do part-time jobs. They earn some money. (Combine the sentences using 'by + Ving' construction.)", "a": "University students in many countries earn some money by doing part-time jobs."}, {"n": 8, "q": "The number of wi-fi networks is growing rapidly. They are easy and inexpensive to set up. (Rewrite, using the participle phrase.)", "a": "Being easy and inexpensive to set up, wi-fi networks are growing rapidly. (or) Being easy and inexpensive to set up, the number of wi-fi networks is growing rapidly."}, {"n": 9, "q": "The population explosion has pushed people towards towns and cities. (Rewrite the sentence using 'It is' / 'It was' emphasizing the underlined words.)", "a": "It is the population explosion that has pushed people towards towns and cities."}, {"n": 10, "q": "The four young men paid their respects to their professor. They set forth on their journey home. (Combine the sentences using 'after + Ving'.)", "a": "After paying their respects to their professor, the four young men set forth on their journey home."}]}, {"id": 48, "questions": [{"n": 1, "q": "The audience needs to be more disciplined or they will be asked to leave the stadium. (Use 'Unless'.)", "a": "Unless the audience is more disciplined, they will be asked to leave the stadium."}, {"n": 2, "q": "The scientists are paying close attention to how mosquitoes cause infection diseases. (Change the sentence into the passive voice.)", "a": "Close attention to how mosquitoes cause infection diseases is being paid by the scientists. / Close attention is being paid to how mosquitoes cause infection diseases by the scientists."}, {"n": 3, "q": "The problem was so difficult that he could not solve it in a short time. (Rewrite, using 'enough to'.)", "a": "The problem was not easy enough for him to solve in a short time."}, {"n": 4, "q": "A few days after the entrance exam, I received an email which offered me to attend the university. (Rewrite the sentence omitting the relative pronoun.)", "a": "A few days after the entrance exam, I received an email offering me to attend the university."}, {"n": 5, "q": "You will be treated by others as you treat them. (Change the sentence into the passive voice.)", "a": "Others will treat you as you treat them."}, {"n": 6, "q": "As soon as I closed my eyes, I fell asleep. (Rewrite the sentences by using 'No sooner...than'.)", "a": "No sooner did I close my eyes than I fall asleep."}, {"n": 7, "q": "The price was high. We decided to buy the house. (Join, using the appropriate subordinating conjunction.)", "a": "Although the price was high, we decided to buy the house."}, {"n": 8, "q": "As I work more, I spend less time with my family. (Use 'the more/less/ -er..., the more/ less/-er...'.)", "a": "The more I work, the less time I (have to) spend with my family."}, {"n": 9, "q": "Learning can help us experience the beauty of the world. (Rewrite the sentence using 'It is' / 'It was' emphasizing the underlined words.)", "a": "It is the beauty of the world that learning can help us experience."}, {"n": 10, "q": "Students deserve equal opportunities. They come from everywhere. (Rewrite, using 'no matter...'.)", "a": "Students deserve equal opportunities no matter where they come from."}]}, {"id": 49, "questions": [{"n": 1, "q": "The future of a nation will be shaped by the education of its youth. (Change into the passive voice.)", "a": "The education of the youth of a nation will shape its future (the future of it)."}, {"n": 2, "q": "He said to me, \"Try hard until your good is better and your better is best.\" (Change the sentence into the reported speech.)", "a": "He told me to try hard until my good is(was) better and my better is(was) best."}, {"n": 3, "q": "The road she took is more difficult than mine. (Rewrite, using 'not as...as'.)", "a": "The road I took is not as difficult as hers (the road she took)."}, {"n": 4, "q": "If he does not create change, change will create him. (Rewrite the sentences by using 'Unless'.)", "a": "Unless he creates change, change will create him."}, {"n": 5, "q": "The table clock doesn't show the correct time and the wall clock doesn't either. (Join, using 'neither...nor'.)", "a": "Neither the table clock nor the wall clock shows the correct time."}, {"n": 6, "q": "As soon as he put the phone down, it started ringing again. (Rewrite, using 'No sooner......than'.)", "a": "No sooner did he put the phone down than it started ringing again."}, {"n": 7, "q": "The rain was heavy. The drainage system saved the town from floods. (Join the sentences using the appropriate subordinating conjunction.)", "a": "Although the rain was heavy, the drainage system saved the town from floods."}, {"n": 8, "q": "As you pay more, the quality becomes better. (Rewrite, using 'the more/less/-er, the more/less/ -er...'.)", "a": "The more you pay, the better the quality (becomes)."}, {"n": 9, "q": "Hard work can help us achieve success. (Use 'It is' / 'It was' emphasizing the underlined words.)", "a": "It is hard work that can help us achieve success."}, {"n": 10, "q": "You (mustn't/don't have to) cross the roads without looking. It's dangerous. (Choose the correct option.)", "a": "mustn't"}]}, {"id": 50, "questions": [{"n": 1, "q": "Kyaw Thu said, \"Please don't tell my father that I did not attend the classes yesterday.\" (Change the sentence into the reported speech.)", "a": "Kyaw Thu told me not to tell his father that he had not attended the classes the day before."}, {"n": 2, "q": "The school you are trying to find is around the corner. (Rewrite the sentence in inversion.)", "a": "Around the corner is the school you are trying to find."}, {"n": 3, "q": "My mother had just finished cooking dinner when my father got home from work. (Rewrite the sentences by using 'No sooner......than'.)", "a": "No sooner had my mother finished cooking than my father got home from work."}, {"n": 4, "q": "The police have investigated an official enquiry into the accident. (Change into the passive voice.)", "a": "An official enquiry has been investigated into the accident by the police. / An official enquiry into the accident has been investigated by the police."}, {"n": 5, "q": "I admitted my mistake to my mother. Then, I felt relieved. (Combine the sentences using 'after + Ving'.)", "a": "After admitting my mistake to my mother, I felt relieved."}, {"n": 6, "q": "I have seen this movie several times. I still cry at the end. (Use the appropriate subordinating conjunction.)", "a": "Although I have seen this movie several times, I still cry at the end."}, {"n": 7, "q": "If you follow the school rules and regulations, you won't be punished. (Rewrite the sentences by using 'Unless'.)", "a": "Unless you follow the school rules and regulations, you will be punished."}, {"n": 8, "q": "It is very cold. We cannot go out without wearing warm clothes. (Combine, using 'too...to'.)", "a": "It is too cold to go out without wearing warm clothes."}, {"n": 9, "q": "We sometimes work too hard to enjoy the beauty of nature. (Combine the sentence using 'so...that'.)", "a": "We sometimes work so hard that we cannot enjoy the beauty of nature."}, {"n": 10, "q": "Thida shouted with joy when she heard that she won a scholarship to study at Harvard University. (Rewrite, using the participle phrase.)", "a": "Hearing that she won a scholarship to study Harvard University, Thida shouted with joy."}]}, {"id": 51, "questions": [{"n": 1, "q": "The weather is not warm enough to go swimming. (Rewrite, using 'too...to'.)", "a": "The weather is too cold to go swimming."}, {"n": 2, "q": "A jellyfish stung her while she was swimming. (Change the sentence into the passive voice.)", "a": "He was stung by a jellyfish while she was swimming."}, {"n": 3, "q": "He was nearly dead. He had a minor operation and felt relieved. (Join the sentences, using 'before'.)", "a": "He was nearly dead before having a minor operation and feeling relieved."}, {"n": 4, "q": "I may be late too much. But I still have time to play. (Join the sentences, using 'no matter...'.)", "a": "No matter how much I am late, I still have time to play."}, {"n": 5, "q": "A week of playing football is my definition of vacation. (Use 'It is / was...who/ that...'.)", "a": "It is my definition of vacation that is a week of playing football."}, {"n": 6, "q": "The cake was delicious. She baked it for my birthday. (Join the sentences, using an appropriate relative pronoun or relative adverb.)", "a": "The cake that she baked for my birthday was delicious."}, {"n": 7, "q": "The coach develops winning strategies. Her mentorship empowers athletes. (Use 'Not only...but also'.)", "a": "Not only does the coach develop winning strategies, but her mentorship also empowers althetes."}, {"n": 8, "q": "Ko Hein said to Ko Thein, \"I can't wait for summer vacation.\" (Change into indirect speech.)", "a": "Ko Hein told Ko Thein that he could not wait for summer vacation."}, {"n": 9, "q": "Win Oo sings classical songs, Sai Sai sings raps and Lay Phyu sings rocks. (Omit the repeated verbs.)", "a": "Win Oo sings classical songs; Sai Sai raps and Lay Phyu rocks."}, {"n": 10, "q": "His intelligence was good. He solved the sums easily. (Join the sentences, using 'due to'.)", "a": "He solved the sums easily due to his good intelligence."}]}, {"id": 52, "questions": [{"n": 1, "q": "The student attended all the lectures. She wanted to understand the material fully. (Join the sentences, using 'so...that'.)", "a": "The student attended all the lectures so that she would understand the material fully."}, {"n": 2, "q": "She decided to buy the dress. It was expensive. (Join, using 'appropriate subordinating conjunction'.)", "a": "She decided to buy the dress although (even though) it was expensive."}, {"n": 3, "q": "They gave her a nice present in her birthday party. (Change the sentence into the passive voice.)", "a": "She was given a nice present in her birthday party. / A nice present was given to her in her birthday party."}, {"n": 4, "q": "She says what she wants. I will do what I like. (Join the sentences, using 'no matter...'.)", "a": "No matter what she says, I will do what I like."}, {"n": 5, "q": "She enjoys reading books. She was not escaping into another world. (Join, using 'as if/ as though'.)", "a": "She enjoys reading books as if she were escaping into another world."}, {"n": 6, "q": "He did not attend the class yesterday. (Agree the statement with 'So...I' or 'Neither...I'.)", "a": "Neither did I."}, {"n": 7, "q": "The therapist facilitates personal growth. His sessions encourage self-discovery. (Join the sentences, using 'Not only...but also'.)", "a": "Not only does the therapist facilitate personal growth, but his sessions also encourage self-discovery."}, {"n": 8, "q": "The teacher asked Ko Ko why he did not attend his class the day before. (Change into direct speech.)", "a": "The teacher said to Ko Ko, \"Why don't you attend my class yesterday?\""}, {"n": 9, "q": "I helped you a lot, so you succeeded. (Use 'the third conditional'.)", "a": "If I had not helped you a lot, you would not have succeeded."}, {"n": 10, "q": "They chose to move forward with the project after considering all options. (Use 'introductory phrase'.)", "a": "After considering all options, they chose to move forward with the project."}]}, {"id": 53, "questions": [{"n": 1, "q": "I took the medicine. Then, I felt good. (Join the sentences, using 'after'.)", "a": "After taking medicine, I felt good."}, {"n": 2, "q": "She improved her writing skill. She attended an online writing class. (Join the sentences, using 'before'.)", "a": "Before improving her writing skill, she attended an online writing class."}, {"n": 3, "q": "She speaks English fluently. She is not a native speaker. (Join the sentences, using 'as if/ as though'.)", "a": "She speaks English fluently as if she were a native speaker."}, {"n": 4, "q": "They have bought the car made in Japan. (Use 'It is / was...who / that...'.)", "a": "It is the car made in Japan that they have bought."}, {"n": 5, "q": "The nutritionist provides personalized dietary plans. Her guidance promotes healthier lifestyles. (Join the sentences, using 'Not only...but also'.)", "a": "Not only does the nutritionist provide personalized dietary plans. Her guidance promotes healthier lifestyles."}, {"n": 6, "q": "She studies diligently. She wants to pass her exams. (Join the sentences, using 'so...that'.)", "a": "She studies so diligently that she can pass her exams."}, {"n": 7, "q": "She said to him, \"Are you coming to the party?\" (Change the sentence into indirect speech.)", "a": "She asked him if he was coming to the party."}, {"n": 8, "q": "I stayed home as it rained yesterday. (Use 'the third conditional'.)", "a": "If it had not rained yesterday, I would not have stayed home."}, {"n": 9, "q": "You try. You will never know what you're capable of. (Join the sentences, using 'appropriate subordinating conjunction'.)", "a": "Although you try, you will never know what you're capable of."}, {"n": 10, "q": "He forgot his wallet. He couldn't buy lunch. (Join the sentences, using 'because'.)", "a": "He couldn't buy lunch because he forgot his wallet."}]}, {"id": 54, "questions": [{"n": 1, "q": "Mg Mg asked Ma Ma if she saw his book. (Change the sentence into direct speech.)", "a": "Mg Mg said to Ma Ma, \"Do you see my book?\""}, {"n": 2, "q": "The librarian curates diverse collections. Her efforts promote literacy and learning. (Join the sentences, using 'Not only...but also'.)", "a": "Not only does the librarian curate diverse collections, but her efforts also promote literacy and learning."}, {"n": 3, "q": "People spent a lot of money on the first shopping Saturday. (Change the sentence into the passive voice.)", "a": "A lot of money were spent on the first shopping Saturday."}, {"n": 4, "q": "He intends to buy that car. Although it costs too much. (Join the sentences, using 'no matter...'.)", "a": "No matter how much it costs, he intends to buy that car."}, {"n": 5, "q": "He runs very fast. He is not an Olympic athlete. (Join the sentences, using 'as if/ as though'.)", "a": "He runs very fast as if he were an Olympic athlete."}, {"n": 6, "q": "The woman is my neighbour. She has a beautiful garden. (Join the sentences, using an appropriate relative pronoun or relative adverb.)", "a": "The woman who has a beautiful garden is my neighbour."}, {"n": 7, "q": "He exercises regularly. He aims to maintain his fitness. (Join the sentences, using 'so...that'.)", "a": "He exercises regularly so that he can maintain his fitness."}, {"n": 8, "q": "If she (study) hard, she (pass) the exam with distinctions. (Use 'the third conditional'.)", "a": "If he had studied hard, she would have passed with distinctions."}, {"n": 9, "q": "She travels. She takes lots of pictures. (Join, using 'appropriate subordinating conjunction'.)", "a": "Whenever she travels, she takes lots of pictures."}, {"n": 10, "q": "The proposal was approved by the committee. It moved forward. (Use a participle phrase.)", "a": "Approved by the committee, the proposal was moved forward."}]}, {"id": 55, "questions": [{"n": 1, "q": "Khin Khin said to Ma Sint, \"Why were you late yesterday?\" (Change the sentence into indirect speech.)", "a": "Khin Khin asked Ma Sint why she had been late the day before."}, {"n": 2, "q": "The filmmaker produces thought-provoking documentaries. His work highlights social issues. (Join the sentences, using 'Not only...but also'.)", "a": "Not only the filmmaker produce thought-provoking documentaries, but his work also highlights social issues."}, {"n": 3, "q": "The storm destroyed the house in remote areas last month. (Change the sentence into the passive voice.)", "a": "The house was destroyed in remote areas by the storm last month."}, {"n": 4, "q": "Everyone is welcome here. They come from different places. (Join the sentences, using 'no matter...'.)", "a": "No matter where they come from, everyone is welcome here."}, {"n": 5, "q": "They are smiling. They think they have won the lottery. (Join the sentences, using 'as if/ as though'.)", "a": "They are smiling as if they had won the lottery."}, {"n": 6, "q": "May Thu asked for their help to write an essay. (Use 'It is / was...who / that...'.)", "a": "It was to write an essay that May Thu asked for their help."}, {"n": 7, "q": "The team practised extensively. They hoped to win the championship. (Join, using 'so...that'.)", "a": "The team practiced so extensively that they could win the championship."}, {"n": 8, "q": "I don't answer her question, so she doesn't know the truth. (Use 'the second conditional'.)", "a": "If I answered her question, she would know the truth."}, {"n": 9, "q": "He finished the project on time. He was tired. (Join, using 'appropriate subordinating conjunction'.)", "a": "He finished the project on time although he was tired."}, {"n": 10, "q": "The new policy was implemented. The productivity improved. (Join the sentences, using 'as a result'.)", "a": "The new policy was implemented. As a result, the productivity improved. (The new policy was implemented, and as a result, the productivity improved.)"}]}, {"id": 56, "questions": [{"n": 1, "q": "The instructions were too confusing to follow. (Rewrite, using 'not enough...to'.)", "a": "The instructions were not clear/ simple enough to follow."}, {"n": 2, "q": "How do you write that word? (Change the sentence into the passive voice.)", "a": "How is that word written?"}, {"n": 3, "q": "She had a sense of social inferiority. She married with a boss. (Join the sentences, using 'before'.)", "a": "She had a sense of social inferiority before marrying with a boss."}, {"n": 4, "q": "She acts confidently in meetings. She is not a CEO. (Join the sentences, using 'as if/ as though'.)", "a": "She acts confidently in meetings as if she were a CEO."}, {"n": 5, "q": "I will take a nap as soon as I get back from the gym. (Use 'No sooner...'.)", "a": "No sooner do I get back from the gym than I will take a nap."}, {"n": 6, "q": "The book is on the table. It belongs to Nyo Nyo. (Join the sentences, using an appropriate relative pronoun or relative adverb.)", "a": "The book which/ that is on the table belongs to Nyo Nyo."}, {"n": 7, "q": "We will go to the beach. The sun comes out. (Join, using 'appropriate subordinating conjunction'.)", "a": "We will go to the beach when the sun comes out."}, {"n": 8, "q": "Team A will be the champion. If not, Team B will be the champion. (Join, using 'Either...or'.)", "a": "Either Team A or Team B will be the champion."}, {"n": 9, "q": "She said to me, \"Have you returned the book you borrowed yesterday?\" (Change into indirect speech.)", "a": "She asked me if I had returned the book I had borrowed the day before."}, {"n": 10, "q": "I wrote a novel. I wanted to share my story. (Join the sentences, using 'in order that'.)", "a": "I wrote a novel in order that I could share my story."}]}, {"id": 57, "questions": [{"n": 1, "q": "He graduated from YUOE. He was appointed as a senior teacher. (Join the sentences, using 'after'.)", "a": "After graduating from YUOE, he was appointed as a senior teacher."}, {"n": 2, "q": "He has to solve many problems. He wants to succeed. (Join the sentences, using 'no matter...'.)", "a": "No matter how many problems he has to solve, he wants to succeed."}, {"n": 3, "q": "She married and divorced a man in the same day. (Use 'It is / was...who/ that...'.)", "a": "It was she who married and divorced a man in the same day."}, {"n": 4, "q": "All the children like to listen to stories. (Rewrite, using 'There is no + noun...who/that...'.)", "a": "There is no child who does not like to listen to stories."}, {"n": 5, "q": "The physicists conduct advanced experiments. Their research contributes to theoretical advancements. (Join the sentences, using 'Not only...but also'.)", "a": "Not only do the physicists conduct advanced experiments, but their research also contribute to theoretical advancements."}, {"n": 6, "q": "The dress is too tight to wear comfortably. (Rewrite, using 'not enough...to'.)", "a": "The dress is not loose enough to wear comfortably."}, {"n": 7, "q": "Ko Myo told Ni Ni that he had planned to go to the park that day. (Change into direct speech.)", "a": "Ko Myo said to Ni Ni, \"I planned/ have planned to go to the park today.\""}, {"n": 8, "q": "They don't finish early, so they won't go to the movies. (Use 'the third conditional'.)", "a": "If they had finished early, they would have gone to the movies."}, {"n": 9, "q": "She completed her degree. She found a better job. (Join the sentences, using 'as a consequence'.)", "a": "She completed her degree, and as a consequence, she found a better job."}, {"n": 10, "q": "He travelled to Bagan. He wanted to visit historic sites. (Join the sentences, using 'so that'.)", "a": "He travelled to Bagan so that he could visit historic sites."}]}, {"id": 58, "questions": [{"n": 1, "q": "The child laughed loudly. He thinks he has heard the funniest joke ever. (Join, using 'as if / as though'.)", "a": "The child laughed loudly as if he had heard the funniest joke ever."}, {"n": 2, "q": "She waters the flowers every day. (Change the sentence into the passive voice.)", "a": "The flowers are watered every day."}, {"n": 3, "q": "Although he is very careful, he always makes mistakes. (Join the sentences, using 'no matter...'.)", "a": "No matter how careful he is, he always makes mistakes."}, {"n": 4, "q": "He gave me a long and confusing answer when I asked him a simple question. (Use 'It is / was...who/that'.)", "a": "It was a long and confusing answer that he gave me when I asked him a simple question."}, {"n": 5, "q": "The designer creates aesthetically pleasing products. His designs prioritize functionality. (Join the sentences, using 'Not only...but also'.)", "a": "Not only does the designer create aesthetically pleasing products, but his designs also prioritize functionally."}, {"n": 6, "q": "The teacher assigned extra homework. She wanted the students to grasp the concepts better. (Join the sentences, using 'so...that'.)", "a": "The teacher assigned extra homework so that the students could grasp the concepts better."}, {"n": 7, "q": "Theingi said to Ko Lay, \"Can you help me with this problem?\" (Change the sentence into indirect speech.)", "a": "Theingi asked Ko Lay if he could help her with that problem."}, {"n": 8, "q": "I didn't tell him the news as I didn't see him. (Use 'the third conditional'.)", "a": "If I had seen him, I would have told him the news."}, {"n": 9, "q": "The doorbell rang. I was cooking. (Join the sentences, using 'appropriate subordinating conjunction'.)", "a": "The doorbell rang when I was cooking."}, {"n": 10, "q": "She learned to dance. She wanted to enjoy social gatherings. (Join the sentences, using 'in order that'.)", "a": "She learned to dance in order that she could enjoy social gatherings."}]}, {"id": 59, "questions": [{"n": 1, "q": "He studies hard for his exam. His future does not depend on it. (Join, using 'as if/ as though'.)", "a": "He studies hard for his exam as if his future depended on it."}, {"n": 2, "q": "The headmaster called his parents to the office. (Change the sentence into the passive voice.)", "a": "His parents were called to the office by the headmaster."}, {"n": 3, "q": "It does not matter when you get the station. You can call me to take you. (Join, using 'no matter...'.)", "a": "No matter when you get the station, you can call me to take you."}, {"n": 4, "q": "The car is red. It was parked outside my house. (Use an appropriate relative pronoun or relative adverb.)", "a": "The car which/ that was parked outside my house is red."}, {"n": 5, "q": "The fashion designer showcases unique collections. Her creativity defines contemporary style. (Join the sentences, using 'Not only...but also'.)", "a": "Not only does the designer showcase unique collections, but her creativity also defines contemporary style."}, {"n": 6, "  recharge for the evening."}]}, {"id": 98, "questions": [{"n": 1, "q": "She finished her report. She worked late into the night. (Use a participle phrase.)", "a": "She finished her report, working late into the night."}, {"n": 2, "q": "The troops defeated their enemies. They showed great courage and determination. (Join, using 'after'.)", "a": "The troops defeated their enemies after showing great courage and determination."}, {"n": 3, "q": "Although he is very rich, he never lends us any money. (Join the sentences, using 'no matter'...)", "a": "No matter how rich he is, he never lends us any money."}, {"n": 4, "q": "He wrote many plays eloquently. He was not a student of U Pone Nya. (Join, using 'as if/ as though'.)", "a": "He wrote many plays eloquently as he were a student of U Pone Nya."}, {"n": 5, "q": "When you read a lot, you don't need to rely on others for information. (Use 'The more/less / -er'.)", "a": "The more you read, the less you need to rely on others for information."}, {"n": 6, "q": "The game was exciting. We played it all weekend. (Use appropriate relative pronoun or relative adverb.)", "a": "The game which / that we play all weekend was exciting."}, {"n": 7, "q": "The student must complete the thesis by the end of the semester. If they cannot complete in time, they must request an extension from the faculty. (Join the sentences, using 'Either...or'.)", "a": "The student must either complete the thesis by the end of the semester or request an extension form the faculty."}, {"n": 8, "q": "She is too tired to continue studying. (Rewrite, using 'not enough...to'.)", "a": "She is not fresh/ active enough to continue studying."}, {"n": 9, "q": "As I know how to swim, I join you in the pool. (Use 'the second conditional'.)", "a": "If I knew how to swim, I would join in you in the pool."}, {"n": 10, "q": "They saved money for months. They were able to buy a new car. (Join the sentences, using 'as a result'.)", "a": "They saved money for months, and as a result, they were able to buy a new car."}]}, {"id": 99, "questions": [{"n": 1, "q": "You may drive very carefully, but you shouldn't drink alcohol. (Join the sentences, using 'no matter'...)", "a": "No matter how carefully you drive, you shouldn't drink alcohol."}, {"n": 2, "q": "We pass through the gates of the old city when we go to school. (Change into the passive voice.)", "a": "The gates of the old city are passed through when we go to school."}, {"n": 3, "q": "The children climbed the trees quickly. They were not monkeys. (Join, using 'as if/ as though'.)", "a": "The children climbed the trees quickly as if they were monkeys."}, {"n": 4, "q": "She had to take out a student loan to help her through college. (Use 'It is / was...who / that...'.)", "a": "It was a student loan that she had to take out to help her through college."}, {"n": 5, "q": "The symphony showcased classical techniques. It also incorporated modern elements. (Join the sentences, using 'Not only...but also'.)", "a": "The symphony not only showcased classical techniques but also incorporated modern elements."}, {"n": 6, "q": "He took notes during the lecture. He wanted to review the material later. (Join, using 'so...that'.)", "a": "He took notes during the lecture so that he could review the material later."}, {"n": 7, "q": "His grasp of the language is more fluent than most learners'. (Use 'not as...as'.)", "a": "Most learners' grasp of the language is not as fluent as his (grasp of the language)."}, {"n": 8, "q": "The weather was not fine, so we did not go to the beach. (Use 'the third conditional'.)", "a": "If the weather had been fine, we would have gone to the beach."}, {"n": 9, "q": "The woman whose name I forgot is my colleague. (Omit the relative pronoun.)", "a": "The woman I forgot her name is my colleague."}, {"n": 10, "q": "I checked my emails while waiting for my coffee. (Use 'introductory phrase'.)", "a": "While waiting for my coffee, I checked my emails."}]}, {"id": 100, "questions": [{"n": 1, "q": "The teacher explained the students the importance of proofreading one's sentences. (Change the sentence into the passive voice.)", "a": "The students were explained the importance of proofreading one's sentence by the teacher."}, {"n": 2, "q": "Although she is very beautiful, he won't marry her. (Join the sentences, using 'no matter'...)", "a": "No matter how beautiful she is, he won't marry her."}, {"n": 3, "q": "She studies diligently. (She is a medical student.) (Join the sentences, using 'as if/ as though'.)", "a": "She studies diligently as if he were a medical student."}, {"n": 4, "q": "Unless you want to worry about financial emergencies much, you must save a lot of money. (Use 'The more/less/-er'.)", "a": "The more money you save, the less you worry about financial emergencies."}, {"n": 5, "q": "The dress is beautiful. It is also affordable. (Join the sentences, using 'Not only...but also'.)", "a": "The dress is not only beautiful but also affordable."}, {"n": 6, "q": "The artist used vibrant colours. Her painting would stand out. (Join the sentences, using 'so...that'.)", "a": "The artist used vibrant colours so that her painting would stand out."}, {"n": 7, "q": "The team's performance in this season is better than during the last season. (Use 'not as...as'.)", "a": "The team performance during the last season is not as good as this season's. / The team performance in this season is not as bad as during the last season."}, {"n": 8, "q": "I did not have wings, so I could not fly around the world. (Use 'the third conditional'.)", "a": "If I had had wings, I would have flown around the world."}, {"n": 9, "q": "We decided to go for a hike despite the rain. (Use 'introductory phrase'.)", "a": "Despite the rain, we decided to go for a hike."}, {"n": 10, "q": "The athlete was trained for years. He finally competed in the Olympics. (Use a participle phrase.)", "a": "Trained / Being trained for years, the athlete competed in the Olympics."}]}];
let current = 1;
let answersVisible = false;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const ex = exercises[current-1];
  document.getElementById('setInput').value = current;
  document.getElementById('counter').textContent = `Set ${current} of ${exercises.length}`;
  document.getElementById('progressBar').style.width = `${current/exercises.length*100}%`;

  let html = `<section class="card">
    <div class="exercise-title">
      <h2>Exercise ${ex.id}</h2>
      <span class="marks">10 Questions</span>
    </div>`;

  ex.questions.forEach(item => {
    html += `<div class="question">
      <div class="qtext">${item.n}. ${escapeHtml(item.q)}</div>
      <div class="answer-box">
        <div class="answer ${answersVisible ? 'show' : ''}" id="a-${item.n}">
          <div class="answer-label">Answer</div>
          <div>${escapeHtml(item.a)}</div>
        </div>
      </div>
    </div>`;
  });

  html += `</section>`;
  document.getElementById('content').innerHTML = html;
  document.getElementById('toggleBtn').textContent = answersVisible ? 'Hide Answer Key' : 'Show Answer Key';
  document.getElementById('prevBtn').disabled = current === 1;
  document.getElementById('nextBtn').disabled = current === exercises.length;
  document.getElementById('prevBtn').style.opacity = current === 1 ? '.5' : '1';
  document.getElementById('nextBtn').style.opacity = current === exercises.length ? '.5' : '1';
  window.scrollTo({top:0,behavior:'smooth'});
}

function goToSet(n) {
  n = Number(n);
  if (!Number.isInteger(n) || n < 1 || n > exercises.length) {
    alert('Please enter a Set number from 1 to 100.');
    return;
  }
  current = n;
  answersVisible = false;
  render();
}

document.getElementById('prevBtn').addEventListener('click', () => {
  if (current > 1) { current--; answersVisible=false; render(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (current < exercises.length) { current++; answersVisible=false; render(); }
});
document.getElementById('goBtn').addEventListener('click', () => goToSet(document.getElementById('setInput').value));
document.getElementById('setInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') goToSet(e.target.value);
});
document.getElementById('toggleBtn').addEventListener('click', () => {
  answersVisible = !answersVisible;
  document.querySelectorAll('.answer').forEach(x => x.classList.toggle('show', answersVisible));
  document.getElementById('toggleBtn').textContent = answersVisible ? 'Hide Answer Key' : 'Show Answer Key';
});
render();
</script>
</body>
</html>
