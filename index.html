<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Grammar Exercises - Interactive Practice</title>
<style>
:root { --bg:#f3f5f8; --card:#fff; --text:#18202a; --muted:#667085; --line:#d9dee7; --accent:#2563eb; --accent2:#1d4ed8; --ok:#137333; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
.app{max-width:980px;margin:0 auto;padding:14px}
header{position:sticky;top:0;z-index:10;background:rgba(243,245,248,.96);backdrop-filter:blur(8px);padding:8px 0 12px}
.top{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
h1{font-size:20px;margin:0 0 8px}
.sub{font-size:13px;color:var(--muted);margin-bottom:10px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,input{font:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px}
button:hover{border-color:#9aa5b5}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{background:var(--accent2)}
button:disabled{opacity:.45;cursor:not-allowed}
.search{display:flex;gap:6px;align-items:center}
.search input{width:82px;border:1px solid var(--line);border-radius:10px;padding:11px;text-align:center;min-height:44px;font-size:16px;-webkit-appearance:none}
.status{font-size:13px;color:var(--muted);margin-left:auto}
.exercise{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:14px;min-height:calc(100vh - 190px);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.exercise h2{margin:0 0 6px;font-size:20px}
.instruction{font-size:14px;color:#475467;margin-bottom:16px}
.q{padding:13px 0;border-top:1px solid #edf0f4}
.q:first-child{border-top:0}
.qtext{font-size:15px;margin-bottom:8px}
.answer{display:none;background:#f0fdf4;border-left:3px solid #22c55e;border-radius:6px;padding:9px 11px;font-size:14px;color:#14532d}
.answer.show{display:block}
.answer-label{font-weight:700;margin-right:5px}
.footer-controls{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.small{font-size:12px;color:var(--muted)}
@media(max-width:600px){.app{padding:8px}.exercise{padding:14px;min-height:calc(100vh - 170px)}.status{width:100%;margin-left:0}button{padding:8px 10px}.qtext{font-size:14px}}
@media print{header{position:static}body{background:#fff}.exercise{box-shadow:none;min-height:auto;page-break-after:always}.answer{display:block}}
</style>
</head>

let current=1;
const main=document.getElementById('main');
const status=document.getElementById('status');
const input=document.getElementById('setNo');
function render(n){
  n=Math.max(1,Math.min(100,Number(n)||1)); current=n;
  const set=DATA[n-1];
  main.innerHTML=`<section class="exercise"><h2>Exercise ${set.n}</h2><div class="instruction">Complete all 10 questions, then use <b>Show Answers</b> to check your answers.</div>${set.items.map((it,i)=>`<div class="q"><div class="qtext"><b>${i+1}.</b> ${escapeHtml(it.q)}</div><div class="answer"><span class="answer-label">Answer:</span>${escapeHtml(it.a || 'Answer not available in the source answer key.')}</div></div>`).join('')}<div class="footer-controls"><button onclick="goSet(current-1)" ${current===1?'disabled':''}>‹ Previous</button><span class="small">Exercise ${current} of 100</span><button class="primary" onclick="goSet(current+1)" ${current===100?'disabled':''}>Next ›</button></div></section>`;
  status.textContent=`Exercise ${current} / 100`;
  input.value=current;
  document.documentElement.scrollTop=0; document.body.scrollTop=0;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function goSet(n){if(n>=1&&n<=100) render(n)}
document.getElementById('prev').addEventListener('click',function(){goSet(current-1);});
document.getElementById('next').addEventListener('click',function(){goSet(current+1);});
document.getElementById('go').addEventListener('click',function(){goSet(input.value);});
input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();goSet(input.value);}});
document.getElementById('showAll').addEventListener('click',function(){document.querySelectorAll('.answer').forEach(function(x){x.classList.add('show');});});

document.addEventListener('keydown',function(e){if(e.target===input)return;if(e.key==='ArrowLeft')goSet(current-1);if(e.key==='ArrowRight')goSet(current+1);});
render(1);
