<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Grammar Mixed Exercises</title>
<style>
:root {
  --bg:#f4f7fb; --card:#ffffff; --text:#182230; --muted:#667085;
  --primary:#2563eb; --primary2:#1d4ed8; --border:#d9e1ec;
  --answer:#ecfdf3; --answerBorder:#86efac;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.55}
.app{max-width:1050px;margin:0 auto;padding:18px}
header{background:linear-gradient(135deg,#173b8f,#2563eb);color:#fff;border-radius:18px;padding:22px;margin-bottom:14px;box-shadow:0 8px 25px rgba(0,0,0,.10)}
h1{margin:0 0 6px;font-size:25px}
.subtitle{opacity:.92;font-size:14px}
.toolbar{position:sticky;top:0;z-index:10;background:rgba(244,247,251,.96);backdrop-filter:blur(8px);padding:10px 0}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);padding:10px;border-radius:14px;box-shadow:0 4px 15px rgba(0,0,0,.05)}
button,input{font:inherit}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.nav{background:#eef3ff;color:#173b8f}
.primary{background:var(--primary);color:white}
.primary:hover{background:var(--primary2)}
input[type=number]{width:100px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;text-align:center}
.set-label{font-weight:700}
.counter{margin-left:auto;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 5px 20px rgba(0,0,0,.05)}
.exercise-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}
.exercise-title h2{margin:0;font-size:23px}
.marks{color:var(--muted);font-size:13px}
.question{border:1px solid var(--border);border-radius:14px;padding:15px;margin:12px 0;background:#fff}
.qtext{font-weight:600}
.answer-box{margin-top:11px}
.answer{display:none;background:var(--answer);border:1px solid var(--answerBorder);border-radius:10px;padding:10px 12px;color:#14532d}
.answer.show{display:block}
.answer-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;color:#166534}
.footer-nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.progress{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0 0}
.progress > div{height:100%;background:#2563eb;width:1%}
.note{font-size:12px;color:var(--muted);margin-top:12px}
@media(max-width:650px){
 .app{padding:10px} header{padding:17px} h1{font-size:21px}
 .card{padding:13px} .counter{width:100%;margin-left:0}
 .exercise-title h2{font-size:20px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>English Grammar Mixed Exercises</h1>
  <div class="subtitle">100 Exercise Sets • 10 Questions per Set • Answer Key included</div>
</header>

<div class="toolbar">
  <div class="controls">
    <button class="nav" id="prevBtn">← Previous</button>
    <button class="nav" id="nextBtn">Next →</button>
    <span class="set-label">Exercise Set</span>
    <input id="setInput" type="number" min="1" max="100" value="1" aria-label="Exercise set number">
    <button class="primary" id="goBtn">Go</button>
    <button class="primary" id="toggleBtn">Show Answer Key</button>
    <span class="counter" id="counter"></span>
  </div>
  <div class="progress"><div id="progressBar"></div></div>
</div>

<main id="content"></main>
<div class="note">Source-based app: questions and answer-key wording are preserved from the supplied text file. Answer keys are revealed only when requested.</div>
</div>

<script>
const exercises = [{"id": 1, "questions": [{"n": 1, "q": "As soon as their father arrived home, they had their dinner. (Rewrite, using 'No sooner......than'.)", "a": "No sooner did their father arrive home than they had their dinner."}, {"n": 2, "q": "Myo Aung watered the plants and then went out to play with his friends. (Rewrite, using 'after + Ving'.)", "a": "After watering the plants, Myo Aung went out to play with his friends."}, {"n": 3, "q": "He was very tired. He went on working. (Join, using the appropriate subordinating conjunction.)", "a": "Although he was very tried, he went on working."}, {"n": 4, "q": "I try very hard. I can't solve this problem. (Join the sentences, using 'no matter....')", "a": "No matter how hard I try, I can't solve this problem."}, {"n": 5, "q": "My elder sister sent me a birthday present. (Change the sentence into the passive voice.)", "a": "I was sent a birthday present by my elder sister."}, {"n": 6, "q": "The doctor said to Ko Ko, \"Give up smoking or you will not get well.\" (Change into the reported speech.)", "a": "The doctor warned Ko Ko to give up smoking or he would not get well."}, {"n": 7, "q": "We could not stop our car. We could not slow down our car. (Join, using 'neither...nor'.)", "a": "We could neither stop nor slow down our car."}, {"n": 8, "q": "Mya Mya cooks better than her sister. (Rewrite, using 'not as...as'.)", "a": "Her sister does not cook as well as Mya Mya."}, {"n": 9, "q": "If you tease the dog more, it will get angrier. (Rewrite, using 'the more/less/ -er, the more/less/-er')", "a": "The more you tease the dog, the angrier it will get."}, {"n": 10, "q": "U Min Thwin has gone to Japan. He is the managing diretor of our company. (Use 'Nouns in Apposition'.)", "a": "U Min Thwin, the managing director of our company, has gone to Japan."}]}, {"id": 2, "questions": [{"n": 1, "q": "\"How long does it take to get the city centre?\" I asked her. (Change into the reported speech.)", "a": "I asked her how long it took to get the city centre."}, {"n": 2, "q": "As soon as I shut the door, I realized that I had left my keys inside. (Use 'No sooner......than'.)", "a": "No sooner did I shut the door than I realized that I had left my keys inside."}, {"n": 3, "q": "There was a storm. All flights were cancelled last Monday. (Use the appropriate subordinating conjunction.)", "a": "Because of the storm, all flights were cancelled last Monday."}, {"n": 4, "q": "The resort offers many facilities for young and old alike. (Change the sentence into the passive voice.)", "a": "Many facilities are offered by the resorts for young and old alike."}, {"n": 5, "q": "He is not healthy as he does not do physical exercises. (Use 'the third conditional'.)", "a": "He would have been healthy if he had done physical exercises."}, {"n": 6, "q": "Thuzar got to the airport so late that she did not catch her plane home. (Rewrite, using 'too...to'.)", "a": "Thuzar got to the airport too late to catch her plane home."}, {"n": 7, "q": "She always smiles. She does not care what challenges she faces. (Rewrite, using 'no matter....')", "a": "Going to the cinema is more interesting than watching television at home."}, {"n": 8, "q": "When I looked out across the ocean, I saw a beautiful island. (Rewrite, using the participle phrase.)", "a": "Looking out across the ocean, I saw a beautiful island."}, {"n": 9, "q": "Mother cooks something special for us at weekends. If not, she takes us to a restaurant. (Use 'either...or'.)", "a": "Mother either cooks something special for us or takes us to a restaurant at weekends."}, {"n": 10, "q": "The surgeon operated on the patient. He did not use any kind of anaesthetic. (Use 'without + V-ing'.)", "a": "Without using any kind of anaesthetic, the surgeon operated on the patient."}]}, {"id": 3, "questions": [{"n": 1, "q": "As soon as I saved up enough money, I bought a new computer. (Rewrite, using 'No sooner......than'.)", "a": "No sooner did I save up enough money than I bought a new computer."}, {"n": 2, "q": "The unusual high tide completely washed away several buildings. (Change into the passive voice.)", "a": "Several buildings were completely washed by the unusual high tide."}, {"n": 3, "q": "The man said to me, \"Bring this ticket with you tomorrow.\" (Change into the reported speech.)", "a": "The man asked me to bring that ticket with me the next day.."}, {"n": 4, "q": "I visit my uncle. I see him working in the garden. (Join, using the appropriate subordinating conjunction.)", "a": "When I visit my uncle, I see him working in the garden."}, {"n": 5, "q": "U Ba lost all his money. He also found himself in debt. (Combine, using 'not only...but also'.)", "a": "U Ba not only lost all his money but also found himself in debt. Not only did U Ba lose all his money, but he also found himself in debt."}, {"n": 6, "q": "The earthquake was so strong that it caused a lot of damage near its epicentre. (Use 'such...that'.)", "a": "It was such a strong earthquake that it caused a lot of damage near its epicentre."}, {"n": 7, "q": "If he fell from a great height, he (break) any bones. (Use 'the correct tense of the verb given in brackets.')", "a": "If he fell from a great height, he would break any bones."}, {"n": 8, "q": "As the day of her wedding drew near, she became more nervous. (Use 'the more/less/-er, ...')", "a": "The nearer the day of her wedding drew near, the more nervous she became."}, {"n": 9, "q": "If the earth did not have a moon, there wouldn't be any tides. (Rewrite the sentences by using 'Unless'.)", "a": "Unless the earth had a moon, there wouldn't be any tides."}, {"n": 10, "q": "The music band is more concerned with making money than with making music. (Use 'not as...as'.)", "a": "The music band is not as concerned with making music as with making money."}]}, {"id": 4, "questions": [{"n": 1, "q": "My brother rushed into the kitchen when he arrived home from school. (Use 'the participle phrase'.)", "a": "Arriving home from school, my brother rushed into the kitchen."}, {"n": 2, "q": "The man was so rich that he made a generous donation to the charity. (Rewrite, using 'such...that'.)", "a": "He was such a rich man that he made a generous donation to the charity."}, {"n": 3, "q": "The Shwedagon is the greatest pagoda in Myanmar. (Use 'It is' / 'It was' emphasizing the underlined words.)", "a": "It is The Shwedagon that is the greatest pagoda in Myanmar."}, {"n": 4, "q": "It was very hot last night. I could not get to sleep. (Combine the sentence using 'so...that'.)", "a": "It was so hot that I could not get to sleep last night."}, {"n": 5, "q": "Both the girls are not to be blamed. (Join, using 'neither of...')", "a": "Neither of the girls is to be blamed."}, {"n": 6, "q": "He fell from a great height. He did not break any bones. (Rewrite, using 'the appropriate subordinating conjunction'.)", "a": "In spite of falling from a great height, he did not break any bones. / Although he fell from a great height,"}, {"n": 7, "q": "Cyclone Giri hit the coastal regions in Rakhine State. It was a very destructive storm. (Combine the sentences using 'Nouns in Apposition'.)", "a": "Cyclone Giri, a very destructive storm, hit the coastal regions in Rakhine State."}, {"n": 8, "q": "The weather may be very bad. We will go for our morning run. (Rewrite, using 'no matter...')", "a": "No matter how bad the weather, we will go for our morning run."}, {"n": 9, "q": "His father beat him for not attending classes regularly. (Change the sentence into the passive voice.)", "a": "He was beaten by his father for not attending classes regularly."}, {"n": 10, "q": "The tourist said to the guide, \"Can I buy some silverware from Bogyoke Market?\" (Change the sentence into the reported speech.)", "a": "The tourist asked the guide if he could buy some silverware from Bogyoke Market."}]}, {"id": 5, "questions": [{"n": 1, "q": "The child is not tall enough to reach the bottle on the shelf. (Combine the sentences using 'too...to'.)", "a": "The child is too short to reach the bottle on the shelf."}, {"n": 2, "q": "The teacher is so kind and patient that every student loves her. (Rewrite, using 'such...that'.)", "a": "She is such a kind and patient teacher that every student loves her."}, {"n": 3, "q": "He earned money. He sold eggs in the market. (Combine the sentences using 'by + Ving' construction.)", "a": "He earned money by selling eggs in the market."}, {"n": 4, "q": "\"I'll see you in the office, Mg Mg,\" said the headmistress. (Change into the reported speech.)", "a": "The headmistress told Mg Mg that she would see him in the office."}, {"n": 5, "q": "Pyin Oo Lwin is famous for flowers. It is a pleasant town. (Combine, using 'Nouns in Apposition'.)", "a": "Pyin Oo Lwin, a pleasant town, is famous for flowers."}, {"n": 6, "q": "A new engine is being replaced in my car by the mechanic. (Change the sentence into the active voice.)", "a": "The mechanic is replacing a new engine in my car."}, {"n": 7, "q": "Ko Ko studies his lessons for three hours and then he went to bed. (Rewrite, using 'after + Ving'.)", "a": "After studying his lessons for three lessons, Ko Ko went to bed."}, {"n": 8, "q": "As soon as the teacher left the class, the children began to play. (Rewrite, using 'No sooner... than'.)", "a": "No sooner did the teacher leave the class than the children began to play."}, {"n": 9, "q": "Unless we have passports, we can't go abroad. (Rewrite the sentences by using 'If'.)", "a": "If we have passports, we can go abroad."}, {"n": 10, "q": "Both my sister and I do not like watching TV. (Join, using 'neither...nor'.)", "a": "Neither my sister nor I like watching TV."}]}, {"id": 6, "questions": [{"n": 1, "q": "Unless you get up early, you will miss the first train. (Rewrite the sentences by using 'If'.)", "a": "If you get up early, you will not miss the first train."}, {"n": 2, "q": "When the light went out, we had just finished the work. (Rewrite, using 'No sooner......than'.)", "a": "No sooner had we finished the work than the light went out.."}, {"n": 3, "q": "Ma Khin is so beautiful that everybody can't help gazing at her. (Combine, using 'such...that'.)", "a": "Ma Khin is such a beautiful girl that everybody can't help gazing at her."}, {"n": 4, "q": "Both Ko Kyaw Swar and Ko Thaw Tar are not good at swimming. (Join, using 'neither...nor'.)", "a": "Neither Ko Kyaw Swar nor Ko Thaw Tar is good at swimming."}, {"n": 5, "q": "The arteries allow the blood to flow away from the heart. (Rewrite the sentence using 'It is' / 'It was' emphasizing the underlined words.)", "a": "It is the arteries that allow the blood to flow away from the heart."}, {"n": 6, "q": "Nobody has known the reasons of this problem yet. (Change the sentence into the passive voice.)", "a": "The reasons of this problem have not been known yet."}, {"n": 7, "q": "Father said, \"I'm very tired and I need a rest.\" (Change the sentence into the reported speech.)", "a": "Father said that he was very tired and he needed a rest."}, {"n": 8, "q": "My uncle exercises in the morning and then leaves for work. (Combine, using 'after + Ving'.)", "a": "After exercising in the morning, my uncle leaves for work."}, {"n": 9, "q": "He had seen me in a photograph. So he recognized me at once. (Rewrite, using the participle phrase.)", "a": "Having seen me in a photograph, he recognized me at once."}, {"n": 10, "q": "The movie wasn't very good. We watched it last night. (Use 'the appropriate relative pronoun'.)", "a": "The movie which we watched last night wasn't very good."}]}, {"id": 7, "questions": [{"n": 1, "q": "Unless we have spare wheels, we cannot begin our journey. (Rewrite the sentences by using 'If'.)", "a": "If we have spare wheels, we can begin our journey."}, {"n": 2, "q": "My hobby is playing football; Nilar's hobby is playing badminton and Thida's hobby is playing tennis. (Rewrite the sentence omitting the repeated verbs.)", "a": "My hobby is playing football; Nilar's hobby badmintion and Thida's hobby tennis."}, {"n": 3, "q": "Neither Ni Ni nor Mi Mi knows how to use a computer. (Rewrite the sentences using 'both...and'.)", "a": "Both Ni Ni and Mi Mi know how to use a computer."}, {"n": 4, "q": "Moe Moe said to her brother, \"Where do you keep my watch?\" (Change into the reported speech.)", "a": "Moe Moe asked her brother where he kept her watch."}, {"n": 5, "q": "She is a good actress. She has never received the Academy Award. (Join the sentences using the appropriate subordinating conjunction.)", "a": "In spite of being a good actress, she has never receiced the Academy Award."}, {"n": 6, "q": "The elders should teach children how to behave well. (Change the sentence into the passive voice.)", "a": "Children should be taught how to behave well by the elders. Children should be taught by the elders how to behave well."}, {"n": 7, "q": "The puzzle is too difficult for us to solve. (Rewrite the sentence using 'enough to'.)", "a": "The puzzle is not easy enough for us to solve."}, {"n": 8, "q": "As soon as the trees had been felled, the branches were cut off. (Rewrite, using 'No sooner......than'.)", "a": "No sooner had the trees been felled than the branches were cut off."}, {"n": 9, "q": "Don't expect to get high marks if you don't study your lessons regularly. (Join, using 'without + V-ing'.)", "a": "Without studying your lessons, don't expect to get high marks."}, {"n": 10, "q": "We had our lunch at a restaurant and then we set out. (Combine the sentences using 'after + Ving'.)", "a": "After having our lunch at a restaurant, we set out."}]}, {"id": 8, "questions": [{"n": 1, "q": "Yupar is beautiful. She is not friendly. (Join, using the appropriate subordinating conjunction.)", "a": "Although Yupar is beautiful, she is not friendly."}, {"n": 2, "q": "Mya Thet did all the housework; then she went to the movie with her friends. (Use 'after + Ving'.)", "a": "After doing all the housework, Mya Thet went to the movie with her friends."}, {"n": 3, "q": "He went to bed. He did not eat anything last night. (Join the two sentences using 'without + V-ing'.)", "a": "Without eating anything last night, he went to bed."}, {"n": 4, "q": "If you leave your home soon, you will arrive the station early. (Use 'the more/less/-er, ....')", "a": "The sooner you leave your home, the earlier you will arrive the station."}, {"n": 5, "q": "If you don't sit quietly, you will have to leave the room. (Join, using 'either...or'.)", "a": "Either you sit quietly or you will have to leave the room."}, {"n": 6, "q": "The road is too narrow for the truck to go through. (Rewrite the sentence using 'enough to'.)", "a": "The road is not wide for the truck to go through."}, {"n": 7, "q": "A computer is a useful device. It is an essential device, too. (Rewrite the sentences using 'both...and'.)", "a": "A computer is both a useful and an essential device."}, {"n": 8, "q": "They received more information than we did. (Rewrite, using 'not as...as'.)", "a": "We did not receive as much information as they did."}, {"n": 9, "q": "The man whom I spoke to just now is really helpful. (Rewrite, omitting the relative pronoun.)", "a": "The man I spoke to just now is really helpful."}, {"n": 10, "q": "When father had trimmed the fence, he watered the plants. (Rewrite, using the participle phrase.)", "a": "Having trimmed the fence, father watered the plants."}]}, {"id": 9, "questions": [{"n": 1, "q": "The weather was too cold for them to go for a swim. (Rewrite the sentence using 'so...that'.)", "a": "The weather was so cold that they could not go for a swim."}, {"n": 2, "q": "He ran faster than his brother. (Rewrite, using 'not as...as'.)", "a": "His brother did not run as fast as he did."}, {"n": 3, "q": "When she had drawn the curtains, she switched on the light. (Rewrite, using the participle phrase.)", "a": "Having drawn the curtains, she switched on the light."}, {"n": 4, "q": "She did not pass the entrance exam. She was lazy. (Use 'the third conditional'.)", "a": "She would have passed the entrance exam if she had not been lazy..."}, {"n": 5, "q": "You (mustn't/ don't have to) use the phone while the teacher is teaching. (Choose the correct option.)", "a": "mustn't"}, {"n": 6, "q": "The flood has destroyed many acres of paddy fields. (Change the sentence into the passive voice.)", "a": "Many acres of paddy fields have been destroyed by the flood."}, {"n": 7, "q": "Mango is liked by almost all people in Myanmar. It is a tropical fruit. (Use 'Nouns in Apposition'.)", "a": "Mango, a tropical fruit, is liked by almost all people in Myanmar."}, {"n": 8, "q": "Nilar said, \"Ko Ko, where can I get some stationery?\" (Change the sentence into the reported speech.)", "a": "Nilar asked Ko Ko where she could get some stationery."}, {"n": 9, "q": "She is very rich. She is stingy. (Join the sentences using the appropriate subordinating conjunction.)", "a": "In spite of being very rich, she is stingy."}, {"n": 10, "q": "The dogs have been fed by my aunt. (Change the sentence into the active voice.)", "a": "My aunt has fed the dogs."}]}, {"id": 10, "questions": [{"n": 1, "q": "They work very hard. Their business is not thriving. (Use 'the appropriate subordinating conjunction'.)", "a": "Although they work very hard, their business is not thriving."}, {"n": 2, "q": "She is such a skinny girl that her parents are worried about her health. (Combine, using 'so...that'.)", "a": "The girl is so skinny that her parents are worried about her health."}, {"n": 3, "q": "Some old books are in the library. (Rewrite the sentence in inversion.)", "a": "In the library are some old books."}, {"n": 4, "q": "U Tint Swe is our family doctor. U Tint Swe is very kind to his patients. (Use 'Nouns in Apposition'.)", "a": "U Tint Swe, our family doctor, is very kind to his patients."}, {"n": 5, "q": "You can't defeat her at tennis if you don't practise regularly. (Rewrite the sentences by using 'Unless'.)", "a": "Unless you practise regularly, you can't defeat her at tennis.."}, {"n": 6, "q": "A group of scientists are carrying out an experiment systematically. (Change into the passive voice.)", "a": "An experiment is being systematically carried out by a group of scientists."}, {"n": 7, "q": "As soon as I had taken the medicine, I felt better. (Rewrite the sentences by using 'No sooner......than'.)", "a": "No sooner had I taken the medicine than I felt better."}, {"n": 8, "q": "The teacher said to the students, \"Do all the exercises in this chapter.\" (Change into the reported speech.)", "a": "The teacher told the students to do all the exercises in this chapter."}, {"n": 9, "q": "He is a journal publisher. He is a famous writer. (Combine, using 'not only...but also'.)", "a": "He is not only a journal publisher but also a famous writer."}, {"n": 10, "q": "He checked his answer paper again and submitted it to his teacher. (Combine, using 'before + Ving'.)", "a": "He checked his answer paper again before submitting it to his teacher."}]}, {"id": 11, "questions": [{"n": 1, "q": "Myanmar Pyay Thein Tan is an amazing singer. He could sing many songs without taking a break throughout the night. (Combine the sentences using 'Nouns in Apposition'.)", "a": "Myanmar Pyay Thein Tan, an amazing singer, could sing many songs without taking a break throughout the night."}, {"n": 2, "q": "Unless we keep our environment always clean and green, there might be problems for all living things. (Rewrite the sentences by using 'If'.)", "a": "If we keep our envrironment always clean and green, there might not be problems for all living things."}, {"n": 3, "q": "Learning English is very hard. (Rewrite, using 'It is' / 'It was' emphasizing the underlined words.)", "a": "It is learning English that is very hard."}, {"n": 4, "q": "Sue said, \"Johnsy, don't move and promise me not to look out of the window.\" (Change the sentence into the reported speech.)", "a": "Sue told Johnsy not to move and to promise her not to look out of the window."}, {"n": 5, "q": "My brother is too simple to understand the joke. (Rewrite the sentence using 'enough to'.)", "a": "My brother is not clever enough to understand the joke."}, {"n": 6, "q": "You do not know about that. So, you do not come earlier. (Use 'the second conditional'.)", "a": "If you knew about that, you would come earlier."}, {"n": 7, "q": "The flood destroyed many cars in Thailand. (Change the sentence into the passive voice.)", "a": "Many cars were destroyed in Thailand by the flood."}, {"n": 8, "q": "A student took a reference book away from the library. No one saw him. (Join, using 'without + V-ing'.)", "a": "Without being seen, a student took a reference book away from the library."}, {"n": 9, "q": "When you finish (play) chess, come to me. (Supply the correct form of the verb given in bracket.)", "a": "When you finish playing chess, come to me."}, {"n": 10, "q": "When people grow old, they become more irritated. (Rewrite, using 'the more/less/-er, the more/less/-er')", "a": "The older people grow, the more irritated they become."}]}, {"id": 12, "questions": [{"n": 1, "q": "Western foods are damaging health in the industrialized island country of Japan. (Change the sentence into the passive voice.)", "a": "Health is being damaged by western foods industralized island country of Japan."}, {"n": 2, "q": "\"Will you not sit down, Zaw Zaw?\" said the teacher. (Change the sentence into the reported speech.)", "a": "The teacher asked Zaw Zaw if he would not sit down. The teacher asked Zaw Zaw to sit down."}, {"n": 3, "q": "A student entered the headmaster's room. He did not knock the door. (Join, using 'without + V-ing'.)", "a": "Without knocking the door, a student entered the headmaster's room."}, {"n": 4, "q": "Ko Ko does not eat beef. Nyi Nyi does not eat beef, too. (Join, using 'neither...nor'.)", "a": "Neither Ko Ko nor Nyi Nyi eats beef."}, {"n": 5, "q": "When I arrived at the restaurant, I saw Hnin Hnin. (Rewrite, using the participle phrase.)", "a": "Arriving at the restaurant. I saw Hnin Hnin."}, {"n": 6, "q": "The email that I sent didn't reach everyone. (Rewrite the sentence omitting the relative pronoun.)", "a": "The email I sent didn't reach everyone."}, {"n": 7, "q": "Kyi Pyar is too short to be a model. (Rewrite the sentence using 'so...that'.)", "a": "Kyi Pyar is so short that she cannot be a model."}, {"n": 8, "q": "MRTV 4 broadcasts the latest and breaking news to the public. (Rewrite the sentence using 'It is' / 'It was' emphasizing the underlined words.)", "a": "It is MRTV 4 that broadcasts the latest and breaking news to the public."}, {"n": 9, "q": "Indonesia is one of the ASEAN countries. It is the host country for the $26^{\\text{th}}$ SEA Games. (Combine the sentences using 'Nouns in Apposition'.)", "a": "Indinesia, one of the ASEAN countries, is the host country for the $26^{th}$ SEA Games."}, {"n": 10, "q": "When the examination comes near, the students will become excited. (Rewrite, using 'the more/less/-er..., the more/less/-er...')", "a": "The nearner the examination, the more excited the students (will become)."}]}, {"id": 13, "questions": [{"n": 1, "q": "\"Why were you absent yesterday?\" said the teacher to Myo Min. (Change into the reported speech.)", "a": "The teacher asked Myo Min why he had been absent the day before."}, {"n": 2, "q": "The question was so difficult that no student in the class answer it. (Combine, using 'too...to'.)", "a": "The question was too difficult for any student in the class to answer."}, {"n": 3, "q": "In Myanmar, you (must / have to) drive on the right. (Choose the correct option.)", "a": "Must/have to."}, {"n": 4, "q": "When the athlete knew that he had broken the record, he was delighted. (Use 'the participle phrase'.)", "a": "Knowing that he had broken the record, the athelete was delighted."}, {"n": 5, "q": "It is hotter today than it was yesterday. (Rewrite, using 'not as...as'.)", "a": "It was not as hot yesterday as it is today:"}, {"n": 6, "q": "Nothing is known about the past. (Change the sentence into the active voice.)", "a": "No one knows about the past.."}, {"n": 7, "q": "Follow your doctor's advice, or you won't get better. (Rewrite the sentences by using 'Unless'.)", "a": "Unless you follow your doctor's advice, you won't get better."}, {"n": 8, "q": "U Thein is rich. He is not happy. (Join the sentences using the appropriate subordinating conjunction.)", "a": "Although U Thein is very rich, he is not happy."}, {"n": 9, "q": "Both my parents dislike telling lies. (Join, using 'neither of...')", "a": "Neither of my parents likes telling lies."}, {"n": 10, "q": "Her daughter graduated from Harvard Medical School. She is now at the hospital. (Combine, using the appropriate relative pronoun.)", "a": "Her daughter who graduated from Harvard Medical School is now at the hospital."}]}, {"id": 14, "questions": [{"n": 1, "q": "He folded the letter and then put it into the envelope. (Combine the sentences using 'after + Ving'.)", "a": "After folding the letter, he put it into the envelope."}, {"n": 2, "q": "When glass was invented, the hourglass came into use. (Change the sentence into the active voice.)", "a": "When people invented glass, the hourglass came into use."}, {"n": 3, "q": "I may visit various places. I will carry my memories with you. (Rewrite, using 'no matter...'.)", "a": "No matter where I visit, I will carry my memories with you."}, {"n": 4, "q": "Yangon is more populated than Mandalay. (Rewrite, using 'not as...as'.)", "a": "Mandalay is not as populated as Yangon."}, {"n": 5, "q": "The headmistress said, \"Ko Ko, I'll see you in the office.\" (Change into the reported speech.)", "a": "The headmistress told Ko Ko that he would see him in the office."}, {"n": 6, "q": "If you don't take my advice, you will get into trouble. (Rewrite the sentences by using 'Unless'.)", "a": "Unless you take my advice, you will get into trouble."}, {"n": 7, "q": "Last night, as soon as I lay down, I fell asleep. (Rewrite the sentences by using 'No sooner......than'.)", "a": "No sooner did I lie down than I fell asleep last night."}, {"n": 8, "q": "I have read all the books on my book shelf. (Rewrite, using the double negative pattern.)", "a": "There is no book on my book shelf that I have not read."}, {"n": 9, "q": "She went on working. She was feeling unwell. (Rewrite, using the appropriate subordinating conjunction.)", "a": "In spite of feeling unwell, she went on working."}, {"n": 10, "q": "The box is quite heavy. I cannot carry it. (Combine the sentences using 'too...to'.)", "a": "The box is too heavy for me to carry."}]}, {"id": 15, "questions": [{"n": 1, "q": "Cars and factories are putting more and more gases into the earth's atmosphere. (Change the sentence into the passive voice.)", "a": "More and more gases are being put into the earth's atmosphere by cars and factories."}, {"n": 2, "q": "The teacher said to me, \"Why were you absent yesterday?\" (Change into the reported speech.)", "a": "The teacher asked me why I had been absent the day before."}, {"n": 3, "q": "She introduced her name by herself first, and then she presented her paper interestingly. (Combine the sentences using 'after + Ving'.)", "a": "After introducing her name by herself, she presented her paper interestingly."}, {"n": 4, "q": "Daw Thuzar is more patient than Daw Muyar. (Rewrite, using 'not as ...as'.)", "a": "Daw Muyar is not as patient as Daw Thuzar."}, {"n": 5, "q": "All ASEAN countries have something unique to offer. (Rewrite, using the double negative pattern.)", "a": "There is no ASEAN country that does not have something unique to offer."}, {"n": 6, "q": "KBZ is a reliable bank in Myanmar. AGD is also a reliable bank in Myanmar. (Use 'both...and'.)", "a": "Both KBZ and AGD are reliable banks in Myanmar."}, {"n": 7, "q": "Phyu Phyu is so inquisitive that no one wants to speak to her. (Rewrite the sentence using 'such...that'.)", "a": "Phyu Phyu is such an inquisitive girl that no one wants to speak to her."}, {"n": 8, "q": "Myanmar Rowing team won many prizes at the $26^{\\text{th}}$ SEA Games. (Rewrite the sentence using 'It is' / 'It was' emphasizing the underlined words.)", "a": "It was Myanmar Rowing team that won many prizes at the 26th SEA Games."}, {"n": 9, "q": "Bagan is a famous ancient capital in Myanmar. It is regarded as one of the archaeological treasure houses in Asia. (Combine the sentences using 'Nouns in Apposition'.)", "a": "Bagan, a famous ancient capital in Myanmar, is regarded as one of the archaeological treasure houses in Asia."}, {"n": 10, "q": "If that dacoit died soon, it would be good. (Rewrite, using 'the more/less/-er..., the more/less/-er...')", "a": "The sooner that dacoit died, the better it would be."}]}, {"id": 16, "questions": [{"n": 1, "q": "The old man said to me, \"What's your name and who are your parents?\" (Change the sentence into the reported speech.)", "a": "The old man asked me what my name was and who my parents were."}, {"n": 2, "q": "Students are not allowed to take reference books away from the school library by the librarian. (Change the sentence into the active voice.)", "a": "The librarian does not allow the students to take reference books away from the school library."}, {"n": 3, "q": "Thura bought a watch from Ga Mone Pwint Store. It is for his only sister. (Combine, using the appropriate relative pronoun.)", "a": "The watch which Thura bought from Ga Mone Pwint Store is for his only sister."}, {"n": 4, "q": "Nanda took about an hour to learn a few English sentences by heart. (Rewrite the sentence using 'It is' / 'It was' emphasizing the underlined words.)", "a": "It was Nanda who took about an hour to learn a few English sentence by heart."}, {"n": 5, "q": "They didn't tell me anything about the matter. (Change the sentence into the passive voice.)", "a": "I was not told anything about the matter."}, {"n": 6, "q": "The sea was rough. The fisherman went fishing. (Join, using the appropriate subordinating conjunction.)", "a": "Although the sea was rough, the fisherman went fishing."}, {"n": 7, "q": "The laser is used in surgical operations. If not, the knife is used in surgical operations. (Join, using 'either...or'.)", "a": "Either the laser or the knife is used in surgical operations."}, {"n": 8, "q": "English is more useful than Chinese. (Rewrite, using 'not as...as'.)", "a": "Chinese is not as useful as English."}, {"n": 9, "q": "The letters are sorted and then delivered. (Combine the sentences using 'after + Ving'.)", "a": "After being sorted, the letters are delivered.."}, {"n": 10, "q": "Delicious pizza can be enjoyed at the Italian restaurant. (Rewrite the sentence in inversion.)", "a": "At the Italian restaurant can be enjoyed delicious pizza."}]}, {"id": 17, "questions": [{"n": 1, "q": "I had eaten too much for dinner, I could not sleep well. (Rewrite, using the participle phrase.)", "a": "Having eaten too much for dinner, I could not sleep well."}, {"n": 2, "q": "The car is expensive. So, he does not buy it. (Use 'the second conditional'.)", "a": "If the car was not expensive, he would buy it."}, {"n": 3, "q": "The actor acted wonderfully. He could hold our attention. (Use the appropriate subordinating conjunction.)", "a": "Although the actor acted wonderfully, the actor could not hold our attention."}, {"n": 4, "q": "Tobacco contains nicotine. Nicotine is a substance that stimulates the heart. (Use 'Nouns in Apposition'.)", "a": "Tobacco contains nicotine, a substance that stimulates the heart."}, {"n": 5, "q": "Organic farmers use crop rotations to improve the fertility of their soil. (Change into the passive voice.)", "a": "Crop rotations are used by organic farmers to improve the fertility of their soil."}, {"n": 6, "q": "Zaw Zaw plays soccer better than Tun Tun. (Rewrite, using 'not as...as'.)", "a": "Tun Tun does not play soccer as well as Zaw Zaw."}, {"n": 7, "q": "\"You can come and live with me in Yangon,\" said Daw Lay. (Change into the reported speech.)", "a": "Daw Lay said that I could come and live with her in Yangon."}, {"n": 8, "q": "They spoke very loudly. We all heard what they were talking about. (Combine, using 'so...that'.)", "a": "They spoke so loudly that we all heard what they were talking about."}, {"n": 9, "q": "It took the ship a few minutes to reach the shore. (Use 'It is' / 'It was' emphasizing the underlined words.)", "a": "It was the ship that took a few minutes to reach the shore."}, {"n": 10, "q": "People know that capillaries carry pure blood from the arteries to all the tissues and organs of the body. (Change the sentence into the passive voice beginning with 'it'.)", "a": "It is known that capillaries carry pure blood from the arteries to all the tissues and organs of the body."}]}, {"id": 18, "questions": [{"n": 1, "q": "I met Thida and Nilar in the market. Thida is my neighbour. Nilar is my cousin. (Combine the sentences using 'Nouns in Apposition'.)", "a": "I met Thida, my neighbour and Nilar, my cousin in the market. I met Thida and Nilar, my neighbour and my cousin in the market."}, {"n": 2, "q": "The girl looked for the key and then opened the door. (Combine the sentences using 'after + Ving'.)", "a": "After looking for the key, the girl opened the door."}, {"n": 3, "q": "Sai Sai is a good singer as well as a clever song composer. (Combine, using 'not only...but also'.)", "a": "Sai Sai is not only a good singer but also a clever song composer."}, {"n": 4, "q": "All people say that every school has a library. (Change into the passive voice beginning with 'it'.)", "a": "It is said that every school has a library."}, {"n": 5, "q": "As soon as her father arrived home, they had their dinner. (Rewrite, using 'No sooner......than'.)", "a": "No sooner did her father arrive home than they had their dinner."}, {"n": 6, "q": "Dipa looks very elegant and so does Nanda. (Rewrite, using 'as...as'.)", "a": "Dipa looks as elégant as Nanda."}, {"n": 7, "q": "If you do not attend the class regularly, you will be punished. (Rewrite the sentences by using 'Unless'.)", "a": "Unless you attend the class regularly, you will be punished."}, {"n": 8, "q": "\"Where did you place my purse?\" said Ma Ma. (Change the sentence into the reported speech.)", "a": "Ma Ma asked me where I had placed her purse."}, {"n": 9, "q": "He played football so well that he was awarded a gold medal. (Rewrite the sentences using 'such...that'.)", "a": "He was such a good football player that he was awarded a gold medal."}, {"n": 10, "q": "I may fail many times. I will keep trying. (Rewrite, using 'no matter....')", "a": "No matter how many times I fail, I will keep trying."}]}, {"id": 19, "questions": [{"n": 1, "q": "Just as the boys started playing football, their mother asked them to help her. (Use 'No sooner......than'.)", "a": "No sooner did the boy start playing football than their mother asked them to help her."}, {"n": 2, "q": "The storm was so destructive that many people became homeless. (Rewrite, using 'such...that'.)", "a": "It was such  destructive storm that many people became homeless."}, {"n": 3, "q": "Was the windowpane broken by my children? (Change the sentence into the active voice.)", "a": "Did the children break the window pane?"}, {"n": 4, "q": "She left. She did not say goodbye. (Join the two sentences using 'without + V-ing'.)", "a": "Without saying goodbye, she left."}, {"n": 5, "q": "Both my mother and my sister are doctors. (Combine, using 'not only...but also'.)", "a": "Not only my mother and my sister is a doctor."}, {"n": 6, "q": "Mandalay is bigger than Monywa. (Rewrite, using 'not as...as'.)", "a": "Monywa is not as big as Mandalay."}, {"n": 7, "q": "We visited Bagan last year. It is one of the tourist attractions in Myanmar. (Use 'Nouns in Apposition'.)", "a": "We visited Bagan, one of the tourist attractions in Myanmar, last year."}, {"n": 8, "q": "My father gave up smoking when he realized that it was harmful to his health. (Rewrite, using the participle phrase.)", "a": "Realizing that it was harmful to his health, my father gave up smoking."}, {"n": 9, "q": "Try your best for your future or you will regret. (Rewrite the sentences by using 'Unless'.)", "a": "Unless you try your best for your future, you will regret."}, {"n": 10, "q": "\"Can you tell me where 'May Shopping Centre' is, Ko Ko?\" said Mee Mee. (Change the sentence into the reported speech.)", "a": "Mee Mee asked Ko Ko if he could tell her whrere 'May Shopping Centre' was."}]}, {"id": 20, "questions": [{"n": 1, "q": "You need to believe in yourself. The outcome may be good or bad. (Rewrite, using 'no matter...'.)", "a": "You need to believe in yourself no matter what the outcome (is)."}, {"n": 2, "q": "Don't expect to get high marks if you don't study your lessons regularly. (Join the two sentences using 'without + V-ing'.)", "a": "Without studying your lessons regularly, don't expect to get high marks."}, {"n": 3, "q": "I shut the door. I realized that I had left my keys inside. (Rewrite, using 'the appropriate subordinating conjunction'.)", "a": "As soon as I shut the door, I realized that I had left my keys inside."}, {"n": 4, "q": "Reading a book is more relaxing than watching a movie. (Rewrite, using 'not as...as'.)", "a": "Watching a movie is not as relaxing as reading a book."}, {"n": 5, "q": "The doctor said to Ko Ko, \"Give up smoking or you will not get well.\" (Change the sentence into the reported speech.)", "a": "The doctor warned Ko Ko to give up smoking or he would not get well."}, {"n": 6, "q": "Kalaw is famous for pine trees. It is a pleasant town. (Combine, using 'Nouns in Apposition'.)", "a": "Kalaw, a pleasant town, is famous for pine tress."}, {"n": 7, "q": "We had passports. We went abroad. (Use 'the third conditional'.)", "a": "If we had not had passports, we would not gone abroad."}, {"n": 8, "q": "Mon Mon did not feel well enough to go to the School Family Day Celebration. (Use 'too...to'.)", "a": "Mon Mon felt too ill to go to the School Family Day Celebration."}, {"n": 9, "q": "We donated food and clothes to the storm victims. (Change the sentence into the passive voice.)", "a": "Food and clothes were donated to the storm victims."}, {"n": 10, "q": "As the exam drew near, she became more excited. (Rewrite, using 'the more/less/-er')", "a": "The nearer the exam, the more excited she became."}]}, {"id": 21, "questions": [{"n": 1, "q": "She is so young that she can't stand on her own. (Combine the sentences using 'too...to'.)", "a": "She is too young to stand on her own..."}, {"n": 2, "q": "He drives so skillfully that the passengers feel safe and secure. (Rewrite the sentence using 'such...that'.)", "a": "He is such a skillful driver that the passengers feel safe and secure."}, {"n": 3, "q": "If you speak more English, you'll become more fluent. (Use 'the more/less/-er..., the more/less/-er...')", "a": "The more English you speak, the more fluent you'll become."}, {"n": 4, "q": "When she had taken some medicine, she felt better. (Rewrite, using the participle phrase.)", "a": "Having taken some medicine, she felt better."}, {"n": 5, "q": "All the tourists visit Mandalay. It is the most well-known place in Myanmar. (Use 'Nouns in Apposition'.)", "a": "All the tourists visit Mandalay, the most well-known place in Myanmar."}, {"n": 6, "q": "Identity cards must be brought by all the candidates to the examination hall. (Change the sentence into the active voice.)", "a": "All the candidatess must bring identity cards to the examination hall."}, {"n": 7, "q": "Kyaw Kyaw studied his lessons and then he went out to play. (Combine, using 'before + Ving'.)", "a": "After studying his lessons, Kyaw Kyaw went out."}, {"n": 8, "q": "More fuel is used by old cars than new cars. (Change the sentence into the active voice.)", "a": "Old cars do not use as much fuel as new cars."}, {"n": 9, "q": "The questions were easy. All candidates did well in the exam. (Use appropriate subordinating conjunction.)", "a": "As the questions were easy, all candidates did well in the exam."}, {"n": 10, "q": "Cho Cho may have come here or also Nyo Nyo may have come here. (Join, using 'either...or'.)", "a": "Either Cho Cho or Nyo Nyo may have come here.."}]}, {"id": 22, "questions": [{"n": 1, "q": "Don't care about what others say. You should believe in yourself. (Use 'no matter...'.)", "a": "No matter what others say, you should believe in yourself."}, {"n": 2, "q": "Father said to me, \"Why didn't you go to school yesterday?\" (Change into the reported speech.)", "a": "Father asked me why he had not gone to school the previous day."}, {"n": 3, "q": "Mother went shopping. She did not take her shopping list. (Join, using 'without + V-ing'.)", "a": "Without taking her shopping list, mother went shopping"}, {"n": 4, "q": "As soon as I get back home, I watered the plants in the garden. (Rewrite, using 'No sooner......than'.)", "a": "No sooner did I get back home than I watered the plants in the garden."}, {"n": 5, "q": "My notebook is more expensive than yours. (Rewrite, using 'not as...as'.)", "a": "Your notebook is not as expensive as mine."}, {"n": 6, "q": "Neither human beings nor animals can live on the moon. (Combine, using 'not only...but also'.)", "a": "Not only human beings but also animals cannot live on the moon."}, {"n": 7, "q": "He is very rich. He never looks after his relatives. (Join, using the appropriate subordinating conjunction.)", "a": "Although he is very rich, he never looks after his relatives."}, {"n": 8, "q": "Not only U Ba Chit but also his daughter is a vocalist. (Rewrite the sentences using 'both...and'.)", "a": "Both U Ba Chit and his daughter are vocalists."}, {"n": 9, "q": "Don't drink strong coffee; it will keep you awake the whole night. (Rewrite the sentences by using 'If'.)", "a": "If you drink strong coffee, it will keep you awake the whole night."}, {"n": 10, "q": "Eaint Yati Moe will go abroad next month. She is a famous designer. (Use 'Nouns in Apposition'.)", "a": "Eaint Yati Moe, a famous designer, will go abroad next month."}]}, {"id": 23, "questions": [{"n": 1, "q": "The principal is too busy to listen to you. (Rewrite the sentence using 'so...that'.)", "a": "The principal is so busy that he cannot listen to you."}, {"n": 2, "q": "Ko Lay suggested that we should go to Bagan first. (Rewrite the sentence using 'It is' / 'It was' emphasizing the underlined words.)", "a": "It was Ko Lay who suggested that we should go to Bagan first."}, {"n": 3, "q": "Whales are bigger than dolphins. (Rewrite, using 'not as...as'.)", "a": "Dolphins are not as big as whales."}, {"n": 4, "q": "If you don't know much about him, it is better for you. (Rewrite, using 'the more/less/-er...,')", "a": "The less you know about him, the better it is."}, {"n": 5, "q": "Computers and internet cafes replace type-writer and libraries. (Change into the passive voice.)", "a": "Type-writers and libraries are replaced by computers and internet."}, {"n": 6, "q": "Unless you study it thoroughly, you won't understand it well. (Rewrite the sentences by using 'If'.)", "a": "If you study it thoroughly, you will understand it well."}, {"n": 7, "q": "She went out in the rain. She did not wear the raincoat. (Join the sentences using 'without + V-ing'.)", "a": "Without wearing the raincoat, she went out in the rain."}, {"n": 8, "q": "Both the two girls are not attractive. (Join, using 'neither of...')", "a": "Neither of the two girls is attractive."}, {"n": 9, "q": "He did not want anyone (know / to know) that he was there. (Choose the correct option.)", "a": "to know"}, {"n": 10, "q": "If you (work) hard, you would have been successful. (Complete the sentence, using the correct tense of the verb given in brackets.)", "a": "had worked"}]}, {"id": 24, "questions": [{"n": 1, "q": "Ko Gyi said, \"Ko Nge, why didn't you get up early this morning?\" (Change into the reported speech.)", "a": "Ko Gyi asked Ko Nge why he had not got up early that morning."}, {"n": 2, "q": "Aung Aung was not intelligent enough to be able to solve this problem. (Combine, using 'too...to'.)", "a": "Aung Aung was too dull to be able to solve this problem."}, {"n": 3, "q": "Our teacher was correcting the essays when we entered the room. (Change into the passive voice.)", "a": "The essays were being corrected by our teacher when we entered the room."}, {"n": 4, "q": "Stop arguing with your sister or you'll be beaten by your mother. (Rewrite, using 'Unless'.)", "a": "Unless you stop arguing with your sister, you'll be beaten by your mother."}, {"n": 5, "q": "Su Su did her homework. Then, she said her prayers and went to bed. (Use the participle phrase.)", "a": "Having done her homework, Su Su said her prayers and went to bed."}, {"n": 6, "q": "Tun Tun has computer knowledge. Mg Mg had computer knowledge. (Rewrite, using 'both...and'.)", "a": "Both Tun Tun and Mg Mg have computer knowledge."}, {"n": 7, "q": "Yesterday, as soon as the school bell rang, I hurried home to see my father off at the airport. (Rewrite the sentences by using 'No sooner......than'.)", "a": "No sooner did the school bell ring than I hurried home to see my father off at the airport yesterday."}, {"n": 8, "q": "Min Min tries to improve his vocabulary. He reads daily newspaper. (Use 'by + Ving' construction.)", "a": "Min Min tries to improve his vocabulary by reading daily newspaper."}, {"n": 9, "q": "He was such a clever student that every one in the class envied him. (Combine, using 'so...that'.)", "a": "He was so clever that every one in the class envied him."}, {"n": 10, "q": "Mya Mya cooks better than her sisters. (Rewrite, using 'not as...as'.)", "a": "Her sisters do not cook as well as Mya Mya."}]}, {"id": 25, "questions": [{"n": 1, "q": "Mount Popa lies 50 kilometers southeast of Bagan. Mount Popa is an extinct volcano. (Combine the sentences using 'Nouns in Apposition'.)", "a": "Mount Popa, an extinct volcano, lies 50 kilometers southeas an makes good motor cars. (Change the sentence into the passive voice.)", "a": "Good motor cars are made in Japan."}, {"n": 5, "q": "Some animals live on land; some live in water and some live both on land and in water.", "a": "Some animals live on land; some in water and some both on land and in water."}, {"n": 6, "q": "\"Open your mouth wider so that I can see your teeth,\" said the dentist to the patient. (Change the sentence into the reported speech.)", "a": "The dentist told the patient to, open her mouth wider so that he could see her teeth."}, {"n": 7, "q": "Bagan is visited by almost all the tourists who come to our country. Bagan is the most famous ancient city in Myanmar. (Combine the sentences using 'Nouns in Apposition'.)", "a": "Bagan, the most famous ancient city in Myanmar, is visited by almost all the tourists who come to our country."}, {"n": 8, "q": "Computers can work faster than people. (Rewrite, using 'not as...as'.)", "a": "People cannot work as fast as computers."}, {"n": 9, "q": "If the hotel is expensive, the service is good. (Rewrite, using 'the more/less/-er, the more/less/-er...')", "a": "The more expensive the hotel, the better the service."}, {"n": 10, "q": "She put on make-up and she went into the studio. (Combine the sentences using 'before + Ving'.)", "a": "After putting on make-up, she went into the studio."}]}, {"id": 30, "questions": [{"n": 1, "q": "Students (must / have to) listen to the teacher or they won't understand. (Choose the correct option.)", "a": "must"}, {"n": 2, "q": "Mar Mar said to me, \"When will you go abroad?\" (Change the sentence into the reported speech.)", "a": "Mar Mar asked me when I would go abroad."}, {"n": 3, "q": "The weather was too hot for the children to go for a swim. (Rewrite the sentence using 'so...that'.)", "a": "The weather was so hot that the children could not go for a swim."}, {"n": 4, "q": "He had done his homework, and then watched TV. (Rewrite, using the participle phrase.)", "a": "Having done his homework, he watched TV."}, {"n": 5, "q": "You do not study hard. You will fail in the examination. (Use the appropriate subordinating conjunction.)", "a": "If you study hard, you will not fail in the examination."}, {"n": 6, "q": "He heard the good news. He shouted with joy. (Use 'the third conditional'.)", "a": "No sooner did he hear the news than he shouted with joy."}, {"n": 7, "q": "Hla Maung took my book but he didn't ask for my permission. (Join, using 'without + V-ing'.)", "a": "Without asking for my permission, Hla Maung took my book."}, {"n": 8, "q": "Have you ever been to Pyin Oo Lwin? It is a famous summer resort. (Use 'Nouns in Apposition'.)", "a": "Have you ever been to Pyin Oo Lwin, a famous summer resort?"}, {"n": 9, "q": "When the fire brigade arrived, the building had almost burnt down. (Rewrite, using 'By the time'.)", "a": "By the time the fire brigade arrived, the building had almost burnt down."}, {"n": 10, "q": "Many beautiful old buildings in cities are being replaced by modern buildings. (Change the sentence into the active voice.)", "a": "Modern buildings are replacing many beautiful old buildings in cities."}]}, {"id": 31, "questions": [{"n": 1, "q": "Asians eat more rice than Europeans. (Rewrite, using 'not as...as'.)", "a": "Europeans do not eat as much rice as Asians."}, {"n": 2, "q": "His parents do not allow him to go out at night. (Change the sentence into the passive voice.)", "a": "He is not allowed to go out at night by his parents."}, {"n": 3, "q": "The boys could swim. Nobody taught them. (Join the two sentences using 'without + V-ing'.)", "a": "Without being taught, the boys could swim."}, {"n": 4, "q": "\"Why didn't you study your homework yesterday, Wunna?\" said the teacher. (Change the sentence into the reported speech.)", "a": "The teacher asked Wunna why he had been absent the day before."}, {"n": 5, "q": "We had just arrived home. It began to rain. (Join, using the appropriate subordinating conjunction.)", "a":  "Unless you behave well, you'll not be allowed to attend the party. (Rewrite the sentences by using 'If'.)", "a": "If you behave well, you'll be allowed to attend the party."}, {"n": 9, "q": "Myanmar is a beautiful country. It is rich in natural resources. (Combine, using 'not only...but also'.)", "a": "Myanmar is not only a beautiful country but also rich in natural resources."}, {"n": 10, "q": "The book is not interesting enough for me to continue to read it. (Combine, using 'too...to'.)", "a": "The book is too boring for me to continue to read it."}]}, {"id": 36, "questions": [{"n": 1, "q": "He said that he had stayed at Shwebo the day before. (Change the sentence into the direct speech.)", "a": "He said, \"I stayed at Shwebo yesterday.\""}, {"n": 2, "q": "When I entered the room, I found that the window was open. (Rewrite, using the participle phrase.)", "a": "Entering the room, I found that the window was open."}, {"n": 3, "q": "The winning goal was scored by Cole Palmer. (Change the sentence into the active voice.)", "a": "Cole Palmer scored the winning goal."}, {"n": 4, "q": "Mg Khin is clever enough to answer the questions to the teachers' satisfaction. (Use 'so...that'.)", "a": "Mg Khin is so clever that he can answer the questions to the teachers' satisfaction."}, {"n": 5, "q": "The tourist said to the boy, \"Can you show me the way to the railway station?\" (Change the sentence into the reported speech.)", "a": "The tourist asked the boy if he could show him the way to the railway station."}, {"n": 6, "q": "The journey is very difficult. The destination is worth for it. (Use 'no matter...')", "a": "No matter how difficult the journey (is), the destination is worth for it."}, {"n": 7, "q": "She has a very good job. She isn't well-paid. (Join, using the appropriate subordinating conjunction.)", "a": "Although she has a very good job, she isn't well-paid."}, {"n": 8, "q": "Unless you heed your parents' words, you'll get into trouble. (Rewrite the sentences
